ETIVO DO FORMULÁRIO]?", "Gatilhos", "Curiosidade", "Assunto em aberto", "Quebra de padrão", "Força", "🗑️", "Opção 2 · Escreve e apaga. Manda uma mensagem qualquer e apaga. Fica o \"essa mensagem foi apagada\". Quando ele perguntar o que era:"]}, {"t": "msg", "title": "Follow-up 4 · 9h · Escreve e apaga", "when": "", "x": "Foi mal, {nome}, apaguei sem querer 😅"}, {"t": "raw", "title": "Check 2 · Dia 2", "lines": ["Era isso: você ainda tá atrás de [OBJETIVO DO FORMULÁRIO]?", "Gatilhos", "Curiosidade", "Assunto em aberto", "Quebra de padrão", "Força", "💸", "Opção 3 · Chave Pix. Manda só a pergunta abaixo. Quando ele responder, vem com a segunda:"]}, {"t": "msg", "title": "Follow-up 4 · 9h · Chave Pix · mensagem 1", "when": "", "x": "{nome}, me passa tua chave Pix?\nGatilhos\nQuebra de padrão\nCuriosidade\nAfinidade\nForça"}, {"t": "msg", "title": "Follow-up 4 · 9h · Chave Pix · mensagem 2", "when": "", "x": "Era só pra ver se você ainda tava por aí 😄"}, {"t": "raw", "title": "Check 2 · Dia 2", "lines": ["Agora falando sério: você ainda tá atrás de [OBJETIVO DO FORMULÁRIO]?", "Gatilhos", "Afinidade", "Coerência", "Força", "🏆", "Manda primeiro o print da prova (pega no Drive aqui embaixo), depois a mensagem:"]}, {"t": "msg", "title": "Follow-up 5 · 11h · Prova social", "when": "", "x": "{nome}, olha esse caso aí em cima: cliente que entrou pelo mesmo formulário que você e [RESULTADO DO CLIENTE]."}, {"t": "raw", "title": "Check 2 · Dia 2", "lines": ["Quer que eu te mostre como ficaria no teu caso?", "Gatilhos", "Prova social", "Exclusividade", "Curiosidade", "Força", "📁 Baixar os prints de prova no Drive ↗", "📞", "Liga primeiro. Não atendeu? Manda a mensagem:"]}, {"t": "msg", "title": "Follow-up 6 · 17h · Ligação + simulação", "when": "", "x": "Te liguei agora há pouco, {nome}. Era coisa rápida: montei uma simulação com o valor que você procurava no formulário."}, {"t": "raw", "title": "Check 2 · Dia 2", "lines": ["Posso te mandar aqui mesmo? É 1 minuto de leitura.", "Gatilhos", "Reciprocidade", "Coerência", "Afinidade", "Força", "A quebra de padrão reabre a conversa e a prova social faz o resto: gente acredita em gente. Print de resultado vale mais que qualquer argumento teu."]}, {"t": "h2", "x": "06 · Check 3 · Dia 3"}, {"t": "raw", "title": "Check 3 · Dia 3", "lines": ["Sinceridade, leveza e uma oferta de verdade.", "📞", "Liga primeiro. Não atendeu? Manda a mensagem:"]}, {"t": "msg", "title": "Follow-up 7 · 9h · Sincero e direto", "when": "", "x": "{nome}, vou ser bem sincero contigo: não quero ser chato."}, {"t": "raw", "title": "Check 3 · Dia 3", "lines": ["É que você preencheu o formulário com o objetivo de [OBJETIVO DO FORMULÁRIO], e eu sei que eu consigo te ajudar nisso.", "Só me dá um ok.", "Gatilhos", "Transparência", "Afinidade", "Autoridade", "Coerência", "Força", "😂", "Manda o meme de \"esperando você me responder\" (pega no Drive aqui embaixo). Junto, uma linha só:"]}, {"t": "msg", "title": "Follow-up 8 · 11h · Meme", "when": "", "x": "Sumiu, {nome} 😄 bora retomar?\nGatilhos\nQuebra-gelo\nAfinidade\nQuebra de padrão\nForça\n😂 Baixar os memes no Drive ↗"}, {"t": "msg", "title": "Follow-up 9 · 17h · Carta disponível", "when": "", "x": "{nome}, notícia boa: entrou uma carta de [VALOR] aqui com parcela a partir de [PARCELA]."}, {"t": "raw", "title": "Check 3 · Dia 3", "lines": ["Lembrei de você na hora, porque bate com o que você preencheu no formulário.", "Quer que eu te mande a simulação antes de eu oferecer pra outro cliente?", "Gatilhos", "Escassez", "Aversão à perda", "Ancoragem", "Exclusividade", "Força", "O follow-up 9 só funciona se a carta for real. Escassez inventada o cliente sente de longe. Escassez real fecha venda."]}, {"t": "h2", "x": "07 · Check 4 · o encerramento"}, {"t": "raw", "title": "Check 4 · o encerramento", "lines": ["A mensagem que mais gera resposta é a que encerra a conversa.", "Sem pressão, sem \"última chance\", sem promoção. É a ausência de pressão que faz o lead responder."]}, {"t": "msg", "title": "Follow-up 10 · 9h · Encerramento", "when": "", "x": "{nome}, vou encerrar nosso contato por aqui, porque você parou de responder e eu não quero virar incômodo."}, {"t": "raw", "title": "Check 4 · o encerramento", "lines": ["A carta que eu tinha separado pro teu perfil eu vou liberar pra outro cliente.", "Teu cadastro fica guardado comigo. Se em algum momento voltar a fazer sentido, é só me chamar nessa mesma conversa que eu te atendo na hora.", "Sucesso pra você, {nome}!", "Gatilhos", "Não-venda", "Aversão à perda", "Escassez", "Transparência", "Força", "Nessa mensagem não entra CTA de venda nenhum. Nada de \"última chance\", nada de \"só até hoje\". Ele respondeu? Volta pro atendimento normal. Não respondeu? Geladeira."]}, {"t": "h2", "x": "08 · A geladeira"}, {"t": "raw", "title": "A geladeira", "lines": ["Depois do 10º, o lead não morre. Ele esfria esperando motivo pra voltar.", "D+7 · um conteúdo útil: post teu, notícia do setor, simulação nova. Sem cobrança nenhuma.", "D+15 · um case novo com prova. Print antes, mensagem depois, pergunta leve no final.", "D+30 · uma oportunidade real: carta nova, condição nova. Respondeu? Volta pro jogo do começo.", "Geladeira não é abandono. É contato espaçado, sempre com motivo novo. Lead de formulário custou dinheiro pra chegar. Ninguém joga dinheiro fora."]}, {"t": "h2", "x": "09 · Erros que matam o follow-up"}, {"t": "raw", "title": "Erros que matam o follow-up", "lines": ["5 erros que queimam o lead antes da venda.", "Errado", "Mandar \"Oi, tudo bem?\" e sumir.", "Certo", "Toda mensagem puxa o objetivo do formulário e termina em pergunta.", "Errado", "10 mensagens de texto iguais cobrando resposta.", "Certo", "Variar canal e formato: ligação, texto, áudio, vídeo, meme, prova.", "Errado", "Desistir no 2º contato porque \"o lead não quer\".", "Certo", "Rodar a cadência inteira. A venda mora entre o 5º e o 10º contato.", "Errado", "Encerrar com pressão: \"última chance, promoção só hoje\".", "Certo", "Encerrar limpo, sem pressão. É isso que faz o lead responder.", "Errado", "Continuar cobrando o lead depois do 10º follow-up.", "Certo", "Geladeira: D+7, D+15, D+30, sempre com motivo novo."]}, {"t": "h2", "x": "10 · Plano de ação"}, {"t": "raw", "title": "Plano de ação", "lines": ["3 passos. Cadência montada essa semana.", "1", "Monta tua cadência HOJE", "Copia as 10 mensagens dessa aula, troca os campos {nome}, [SUA EMPRESA] e [TEMA DO ANÚNCIO] pelo teu contexto e salva nas mensagens rápidas do WhatsApp Business.", "Prazo", "Hoje", "Como medir", "10 mensagens salvas nas respostas rápidas", "2", "Grava as 3 munições", "Vídeo de 5 a 10 segundos mostrando a loja (você usa já no dia 1). Áudio mudo de 3 a 5 segundos. E escolhe teu meme de \"esperando resposta\". Deixa os 3 salvos no celular, prontos pra enviar.", "Prazo", "Até amanhã", "Como medir", "3 arquivos salvos no celular", "3", "Roda a cadência completa nos próximos 5 leads", "Sem pular etapa e sem desistir no 2º contato. Anota em qual follow-up cada lead respondeu. Esse número vai te provar sozinho onde mora o ouro.", "Prazo", "Essa semana", "Como medir", "5 leads x número do follow-up que respondeu"]}, {"t": "h2", "x": "11 · O que é vender fofo"}, {"t": "raw", "title": "O que é vender fofo", "lines": ["Aqui a gente não vende fofo.", "Vender fofo é vender sem processo, sem condução, sem follow-up de verdade. Na prática, é isso:", "Apresentar consórcio pelo WhatsApp sem diagnóstico", "Mandar proposta antes de entender a urgência", "Ir pra reunião sem confirmar quem decide", "Não validar prontidão ou momento de compra", "Não confirmar a call no dia (precisa de 3 confirmações: dia da confirmação, manhã da call, 1h antes)", "Fazer menos de 5 follow-ups", "Fazer follow sem personalização (só texto)", "Terminar a conversa sem deixar uma pergunta de condução", "Ter medo de pedir a venda", "Não pedir compromisso"]}, {"t": "h2", "x": "12 · O jeito que a gente faz"}, {"t": "raw", "title": "O jeito que a gente faz", "lines": ["A gente faz o oposto.", "Diagnostica antes de apresentar", "Entende a urgência", "Valida quem decide", "Confirma a capacidade de decisão", "Conduz a reunião", "Faz follow-up com método", "Confirma presença antes da call", "Gera desejo antes de apresentar o produto", "Não deixa o cliente solto no processo", "Lição de casa · semana", "Salva as 10 mensagens da cadência nas respostas rápidas do WhatsApp Business", "Grava o vídeo da loja, o áudio mudo e escolhe o meme", "Liga em até 5 minutos pra todo lead novo de formulário essa semana", "Roda a cadência completa de 10 follow-ups em 5 leads, sem pular etapa", "Anota em qual follow-up cada lead respondeu e posta o número no grupo", "O vendedor comum para no 2º contato. Você vai até o 10º. É lá que mora o ouro."]}, {"t": "h2", "x": "13 · Calculadora comercial"}, {"t": "raw", "title": "Calculadora comercial", "lines": ["Se você não sabe seu número, não sabe se tá atrasado.", "Numa aula ao vivo, a Ana Temoteo (aluna da mentoria) trouxe essa conta: ela sabia o ticket médio dela e a conversão de reunião pra fechamento, e virou a meta do mês em número de reunião por dia. Preenchido abaixo com a média dela pra você ver funcionando — troca pelos seus números.", "💡 Como usar: a taxa de contato → reunião muda muito se o lead veio de indicação, prospecção fria ou tráfego. Escolhe seu canal principal e ajusta a taxa pro que você já sabe que converte com você. Clica no \"?\" de cada campo se tiver dúvida do que preencher.", "Meta de faturamento no mês?", "R$", "3.000.000", "Ticket médio?", "R$", "150.000", "Conversão: reunião → fechamento?", "30", "%", "Dias úteis no mês?", "20", "Seu canal principal", "Indicação", "Prospecção", "Tráfego", "Conversão: contato → reunião?", "40", "%", "+ Modo avançado", "20", "fechamentos", "por mês", "→", "67", "reuniões por mês", "3.4 por dia", "→", "168", "indicações a pedir por mês", "8.4 por dia", "📋 Copiar resultado"]}]}, {"id": "m13", "title": "Aula 13 · O Caminho do Lead", "stage": [], "lead": "Texto da aula da Máquina de Vendas com IA, na íntegra.", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["Aula Magna  ·  Processo Comercial", "O caminho do lead à venda", "Uma trilha. Sete paradas. O consultor bate o olho e sabe em que etapa está e qual parafuso apertar."]}, {"t": "h2", "x": "01 · A trilha"}, {"t": "raw", "title": "A trilha", "lines": ["Cada parada tem um objetivo. Cumpriu, avança.", "1", "Etapa 01", "Posicionamento", "Objetivo: atrair o lead certo", "É aqui que você atrai o lead qualificado e vira autoridade no seu negócio.", "2", "Etapa 02", "Captação", "Objetivo: falar com o cliente", "Prospecção", "Indicação", "Tráfego", "Calculadora de Metas", "3", "Etapa 03", "Follow-up", "Objetivo: levar pra ligação", "10 follow-ups. 4 checks. Depois, a geladeira. O ouro do consórcio está aqui.", "Aula de Processo Comercial", "4", "Etapa 04", "Qualificação na ligação", "Objetivo: vender a reunião", "Não faça", "Entregar o ouro. Explicar tudo no telefone queima a largada da reunião.", "Faça", "Rode o script: poucas perguntas, gera desejo, vende a reunião.", "Abrir o script de qualificação", "Dentro do script, feche os 3 compromissos", "1", "Quem participa", "tem mais alguém que precisa estar nessa reunião?", "script", "2", "O combinado", "5 por dia, me avisa 24h antes se der imprevisto", "script", "3", "A prontidão", "já quer resolver ou ainda tá entendendo?", "script", "5", "Etapa 05", "Reunião", "Objetivo: fazer o fechamento", "Aqui você mostra os números e o plano. Se qualificou bem, já entra fechando, sem tomar objeção.", "6", "Etapa 06", "Fechamento", "Objetivo: pedir a indicação", "Cliente qualificado e reunião feita: o fechamento vira consequência. E abre a porta da indicação.", "7", "Etapa 07", "Indicação / próximo passo agendado", "Só sai da reunião com o próximo passo agendado: fechou = contrato; não fechou = próxima data marcada.", "Alimenta a Captação. O ciclo se fecha."]}, {"t": "h2", "x": "02 · O funil"}, {"t": "raw", "title": "O funil", "lines": ["10 leads", "no mínimo 1 reunião", "10 reuniões", "3 a 4 vendas", "Funil mensal · a cada 100 leads", "100", "25", "10-15", "3-4", "Leads", "topo do funil", "100", "Respondem", "25% do topo", "25", "Reuniões", "qualificadas", "10-15", "Fechamentos", "cartas vendidas", "3-4", "Referência de mercado", "É o mesmo funil que os maiores do mercado usam. A gente não inventou nada, só traduziu pra você.", "Funil de vendas do consórcio - Pedro Rossi"]}, {"t": "h2", "x": "03 · O script da ligação"}, {"t": "msg", "title": "Script de Qualificação · completo", "when": "", "x": "1\nAbertura\n\"João, tudo bom? Aqui é o [seu nome]. Vi que você preencheu meu formulário sobre consórcio. Primeiramente, quero te dizer que eu não tô te ligando pra te vender nada. Antes de tudo eu quero entender se realmente posso te ajudar — e se isso que eu vou te apresentar realmente resolve o teu problema. E olha só, eu me comprometo contigo: pra isso eu só preciso te fazer umas perguntas. E João, se resolver, eu vou te falar; se não for resolver, eu te falo também. Tudo bem até aqui?\"\n2\nAs perguntas\nO objetivo das perguntas é mostrar que o cliente tem um problema.\n\"João, você já conhece consórcio?\"\nfecha a porta da clareza: o cliente sabe que está comprando, não buscando financiamento\n\"Qual seu objetivo com isso?\"\nentende pra que caminho o lead quer seguir e se o produto encaixa pra ele\n\"Pra quando você tá pensando nisso?\"\nentende a prontidão do lead, tanto pra iniciar quanto pra obter o bem; ajuda a definir a melhor estratégia\n\"João, pra montar esse projeto pra você, quanto você tem disponível pra investir hoje?\"\nentende o potencial de pagamento\n3\nExplica breve e gera desejo\n\"João, consigo te ajudar. E realmente, dentro do que você me falou, o consórcio é o melhor caminho pra você. Deixa eu te explicar rapidinho. Pra conquistar isso tem 3 caminhos. À vista, juntar o dinheiro, que a gente sabe que não é fácil. O financiamento, com 20% de entrada e juros de 9 a 11% ao ano, pagando quase dois imóveis no fim. E o consórcio: a carta de crédito, sem juros, só uma taxa bem menor. O consórcio é o caminho de quem tem planejamento e um pouco de paciência: você constrói teu patrimônio pagando o justo, sem a mordida dos juros. Dessas três, qual faz mais sentido pra você?\" (o cliente escolhe consórcio)\n4\nVende a reunião\n\"Perfeito, João. Então agora eu preciso de uma reunião pra te mostrar, no detalhe, como a gente chega nisso. Eu vou montar um plano personalizado, só teu, dentro do que você pode pagar. E olha, esse não é um plano qualquer: é o projeto da tua vida. Meu trabalho é consultivo, eu vou te acompanhar nesse caminho. Por isso, antes de marcar, deixa eu só alinhar umas coisas com você.\""}, {"t": "h2", "x": "04 · Os compromissos"}, {"t": "msg", "title": "Os 3 compromissos · fechar as portas", "when": "", "x": "1. Quem participa: \"João, isso que a gente vai construir aqui é pra tua vida, é um patrimônio que fica pra você e pra tua família. E é nessa reunião que eu monto teu plano por inteiro, do começo ao fim, e passo a te acompanhar nesse caminho. Uma decisão dessa importância a gente toma junto de quem faz parte dela. Então me diz: tem mais alguém importante que precisa estar nessa reunião com você, pra viver esse projeto junto?\"\n2. O combinado: \"João, eu atendo só cinco pessoas por dia, de propósito, porque eu gosto de montar cada projeto com calma e atenção total. Então esse horário eu vou reservar só pra você. E justamente porque é um tempo dedicado, o único combinado que eu te peço é esse: se surgir algum imprevisto, você me avisa com 24 horas de antecedência, que aí eu consigo remanejar e a gente reencaixa o teu numa boa. Posso contar com isso?\"\n3. A prontidão: \"E João, uma última, e é mais pra eu te preparar direito: quando a gente se encontrar, eu quero chegar já com o melhor plano na mão pra você. Então me diz com toda a sinceridade, sem resposta certa ou errada: você já tá num momento de resolver isso, ou ainda é mais pra entender como funciona? Eu só quero montar a reunião no ponto certo pro teu momento.\"\nProcesso comercial mapeado é venda com previsibilidade."}]}, {"id": "m14", "title": "Aula 14 · Anúncios que performam", "stage": [], "lead": "\"Eu nunca tive dinheiro pra dar entrada, e mesmo assim tirei meu apê do aluguel.\"", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["Anúncios que performam", "120 min", "O segredo do anúncio é não parecer anúncio.", "Antes de criar qualquer anúncio, entende o que ele é e pra que serve. O criativo é metade do resultado, e é a metade que só você pode fazer. A outra metade (subir o tráfego, otimizar, escalar) é com a gente. Você grava, a gente faz rodar. E um criativo que vende faz 4 coisas ao mesmo tempo: atrair, segmentar, educar e conduzir.", "Parte 1", "O que é o anúncio, e pra quem"]}, {"t": "h2", "x": "01 · A função do criativo"}, {"t": "raw", "title": "A função do criativo", "lines": ["O anúncio é 50% do resultado. E é a sua metade.", "O resultado do tráfego é 50/50. Metade é o criativo: a sua parte, a única que ninguém grava por você (sua cara, sua voz, seu jeito de falar com o cliente). A outra metade é a nossa: subir, testar, otimizar e escalar, com a estrutura do seu perfil por trás. Você grava, a gente faz rodar. Junto, dá 100%.", "A maioria acha que o anúncio serve só pra \"levar a pessoa pro link\". Errado. Um criativo que vende faz 4 coisas ao mesmo tempo:", "A função do criativo: atrair, segmentar, educar, conduzir", "1", "ATRAIR — parar o dedo", "Nos 3 primeiros segundos, fazer a pessoa parar de rolar e te escutar.", "Bons", "\"Eu nunca tive dinheiro pra dar entrada, e mesmo assim tirei meu apê do aluguel.\"", "\"Se você acha que precisa de 50 mil na conta pra comprar um carro, ninguém te contou isso aqui.\"", "Ruins", "\"Olá, sou consultor de consórcio e vim apresentar nossas cartas.\" (se apresenta, ninguém para)", "\"Consórcio é a melhor forma de realizar o seu sonho!\" (clichê genérico, não para ninguém)", "2", "SEGMENTAR — filtrar quem entra", "O criativo não leva o máximo de gente. Leva a pessoa certa, e afasta o curioso. A gente segmenta por NICHO, não por sub-nicho: são 3 nichos — Veículo, Investimento e Imóvel. Você grava criativos separados pra cada um. Pra gravar por sub-nicho (ex: \"médico que quer consultório\") isso teria que estar claro no seu perfil, na BIO e em toda a estrutura, pro lead entrar no seu perfil e ter clareza que você é especialista no problema dele. Isso vem depois.", "Bons", "Veículo: \"Se você quer trocar de carro mas não quer se enterrar num financiamento de 60 meses, presta atenção.\"", "Imóvel: \"Pra você que paga aluguel há anos e quer a casa própria sem dar entrada.\"", "Ruins", "\"O consórcio serve pra tudo: carro, casa, viagem, reforma, o que você imaginar!\" (fala com todo mundo = não segmenta)", "\"Pra médico cardiologista que quer abrir consultório\" (sub-nicho fino demais pra quem tá começando)", "3", "EDUCAR — elevar a consciência antes da call", "O lead chega na conversa já entendendo o jogo. Call mais curta e mais fácil.", "Bom", "\"No financiamento de 60 meses você paga 220 mil por um carro de 130 mil. No consórcio paga 132 mil, e com o lance antecipa a entrega. Isso é alavancagem, não compra parcelada.\"", "Errado", "\"Consórcio é a melhor forma de comprar seu carro!\" (não ensina nada, não muda a cabeça de ninguém)", "4", "CONDUZIR — fazer o clique parecer óbvio", "A cópia leva ao \"Saiba mais\" como se fosse a única decisão lógica do momento. Sempre \"Saiba mais\".", "Boa", "\"Clica em Saiba mais aqui embaixo que eu te mostro o cálculo exato pro seu caso.\"", "Errada", "\"Se quiser, comenta aqui ou me chama no Direct.\" (complica o caminho)", "\"Tá no link aí.\" (morno, sem motivo pra clicar)", "É por isso que tabela de preço falha: ela só tenta vender (conduzir), pula atrair, segmentar e educar. Por isso atrai curioso."]}, {"t": "h2", "x": "02 · Por que tabela de preço atrai curioso"}, {"t": "raw", "title": "Por que tabela de preço atrai curioso", "lines": ["Você briga pelos 5% que todo mundo briga.", "A maioria dos seus possíveis compradores não está pronta pra comprar agora.", "95%", "do mercado não está pronto pra fechar hoje. Está fora do mercado nesse momento.", "5%", "é onde quase todo anunciante briga. Cada anunciante novo enche mais o leilão desses 5%, e o custo do lead sobe.", "Fonte · Regra 95-5", "Ehrenberg-Bass Institute + LinkedIn B2B Institute", "→", "O funil dos 5 níveis de consciência — o criativo ruim só vende pro fim do funil", "Por que isso acontece — os 5 níveis de consciência (Eugene Schwartz, 1966). A pessoa nunca está em todos ao mesmo tempo. Cada nível tem uma cabeça diferente, e pede um gancho diferente:", "Os 5 níveis de consciência — Eugene Schwartz", "Nível 1 · Inconsciente", "Nem pensa no assunto. Acha que ter o bem é coisa de \"um dia\", ou que pagar juros é normal. Não sabe que o consórcio existe como caminho.", "\"Casa própria é pra quem tem dinheiro guardado. Um dia eu chego lá.\"", "Nível 2 · Consciente do problema", "Sente a dor (quer sair do aluguel, quer o carro), mas acha que a única forma é financiamento ou juntar tudo à vista. Não conhece o consórcio.", "\"Queria sair do aluguel, mas financiamento é juros demais e eu nunca junto a entrada.\"", "Nível 3 · Consciente da solução", "Já ouviu falar de consórcio (sabe que a solução existe), mas tem objeção (\"demora\") ou não confia, e ainda não conhece você.", "\"Consórcio até parece bom, mas dizem que demora anos pra ser contemplado.\"", "Nível 4 · Consciente do produto", "Conhece consórcio e já te acompanha, mas ainda não decidiu. Está comparando, em cima do muro.", "\"Gosto do que esse consultor fala e consórcio faz sentido pra mim... mas será que é a hora? Faço com ele ou direto no banco?\"", "Nível 5 · Totalmente consciente", "Já decidiu que quer e já confia em você. Só falta a oferta, o empurrão (condição, preço, urgência).", "\"Quero fechar minha carta. Só tô esperando a condição certa pra dar o passo.\"", "O erro do consultor médio: ele põe tabela de preço estática no anúncio. A tabela só fala com o nível 5, os 5% que já querem comprar. Os outros 4 níveis (95%) ele não educou. Resultado: o anúncio atrai curioso, oprime, espanta. É pedir o lead em casamento no primeiro \"oi\".", "A solução — um gancho pra cada nível (exemplo: carro). A tabela é só uma porta, a do nível 5. Você tem outras 4 portas que quase ninguém usa:", "Nível 1 · Inconsciente", "\"Você não compra um carro financiado. Você aluga ele do banco por 5 anos, e ainda devolve o dobro.\"", "\"Você vai trabalhar 4 anos pra pagar um carro. O banco não trabalha um dia e ganha mais que você nisso.\"", "Nível 2 · Consciente do problema", "\"Você junta, junta, junta... e quando tem a entrada, o carro já subiu de preço. Não é azar, é armadilha.\"", "\"Cansei de ouvir 'dá a entrada que o resto a gente parcela'. O 'resto' é onde mora o golpe dos juros.\"", "Nível 3 · Consciente da solução", "\"'Consórcio é bom, mas demora.' Quem te falou isso não sabe usar o lance. Eu sei, te mostro.\"", "\"Dá pra furar a fila do consórcio e ser contemplado em meses. Legalmente. Quase ninguém te conta como.\"", "Nível 4 · Consciente do produto", "\"Antes de assinar qualquer carta de consórcio, assiste isso: 3 erros que custam caro.\"", "\"Por que meus clientes saem do banco e fazem o consórcio comigo? Não é sorte, é estratégia de lance.\"", "Nível 5 · Totalmente consciente (aqui a tabela funciona)", "\"Tô com 3 cartas contempláveis essa semana. Quem quer sair de carro novo, clica no Saiba mais.\"", "\"Carta de 120 mil, parcela de 1.100, contemplação ainda esse mês com lance. Link abaixo.\"", "O mesmo vale pra imóvel e investimento: é só trocar o desejo de cada nível.", "Camada extra — a escada de desejo. Saber o nível não basta, tem que descer na profundidade do desejo:", "01", "Superfície", "O que ela diz: \"quero comprar um carro / meu imóvel\"", "→ todo anúncio fala disso", "02", "Intermediária", "O que ela quer: sair do aluguel, fugir dos juros, subir de vida", "→ poucos chegam aqui"]}, {"t": "h2", "x": "03 · Primitiva"}, {"t": "raw", "title": "Primitiva", "lines": ["O que ela sente: segurança, respeito, orgulho da família, liberdade", "→ é aqui que o lead vira cliente", "Falar \"compra seu carro\" cansou. Fala da liberdade de não dever pro banco, do orgulho de dar uma casa pra família. O criativo que escala fala com a camada profunda.", "Resumo: 95% do mercado não tá pronto pra comprar hoje. A tabela de preço só fala com os 5% que já querem, e é por isso que todo mundo briga lá e o lead fica caro. Quem aprende a falar com os outros 4 níveis pega o lead barato que ninguém tá disputando.", "Parte 2", "Como o anúncio funciona (o custo)", "03", "A conta que muda o seu mês", "O mesmo dinheiro. 1 lead ou 10.", "Conta simples: você bota R$ 1.000 no mês pra anunciar. Divide por 30 dias = uns R$ 30 por dia. Agora presta atenção no que o anúncio muda:", "Anúncio comum", "R$ 20", "o lead · R$ 30/dia = ~1 lead por dia", "Anúncio muito bom", "R$ 3", "o lead · R$ 30/dia = 10 leads por dia", "Anúncio que não parece anúncio (vídeo natural): o lead cai pra uns R$ 6 = 5 leads por dia", "É o mesmo dinheiro. A diferença é só o anúncio: no fim do mês, uns 45 leads ou 300 leads", "Lead = a pessoa que viu seu anúncio, clicou e te chamou. O custo de cada um se chama CPL (custo por lead)", "Atenção: não é só sobre ficar barato. Se fosse só preço, era só jogar o link num grupo de WhatsApp, você pega lead a 30 centavos, mas é lead lixo, que não compra. A gente quer o equilíbrio: lead qualificado (que quer e pode comprar) a um preço bom. Anúncio bom faz as duas coisas: atrai o lead certo E barateia."]}, {"t": "h2", "x": "04 · Por que uns pagam barato e outros caro"}, {"t": "raw", "title": "Por que uns pagam barato e outros caro", "lines": ["A Meta cobra menos de quem faz anúncio bom.", "Por que um lead custa R$ 20 pra um e R$ 3 pra outro? Porque dentro do Meta tem um leilão rolando o tempo todo, e todo mundo tá brigando pelo mesmo espaço, pelos olhos das mesmas pessoas.", "Mas não ganha quem paga mais. Ganha quem faz o anúncio que as pessoas gostam de ver", "A Meta vive de manter a pessoa no aplicativo. Ela entrega barato o anúncio que prende a atenção, e cobra caro do anúncio chato que faz a pessoa querer sair", "No seu bolso: anúncio com cara de anúncio = caro. Anúncio que parece conteúdo, que a pessoa quer assistir = barato", "Não é sobre pagar mais. É sobre gravar melhor. O jogo todo tá no seu vídeo."]}, {"t": "h2", "x": "05 · Por que você precisa gravar vários ângulos"}, {"t": "raw", "title": "Por que você precisa gravar vários ângulos", "lines": ["Um craque não ganha o jogo. O time ganha.", "A Meta é movida por inteligência artificial. E pra ela achar as pessoas certas pra você, ela precisa de opção: vários anúncios pra testar e ver qual funciona com cada pessoa.", "Pensa num time de futebol. Você não ganha o campeonato só com o artilheiro. Precisa de quem marca, quem toca, quem cruza, quem defende, cada um numa posição. Os seus anúncios são o seu time: cada um ataca o consórcio de um ângulo diferente, e juntos eles ganham o jogo.", "1", "Segurança", "2", "Juros", "3", "Aluguel", "4", "Financiamento", "5", "Comparação", "6", "Sonho", "7", "Prova", "8", "Lance", "9", "Contemplação", "10", "Urgência", "11", "Liberdade", "12", "Patrimônio", "1 craque não ganha. O time ganha.", "Sobe 1 anúncio só? É como entrar em campo com 1 jogador", "Sobe 8 ângulos diferentes? A Meta testa todos e te entrega o melhor resultado, mais barato", "Ângulo = o jeito de atacar o assunto (juros, sonho, prova, urgência...). Não confunde com formato (onde grava) nem com estrutura (a ordem do que fala). Isso a gente vê já já", "A própria Meta mostrou: teve cliente que saiu de 3-4 anúncios por semana pra quase 50, e o resultado se manteve enquanto crescia. A regra da turma é simples: grava 8 ângulos diferentes, não 1 vídeo caprichado.", "Fonte oficial Meta", "Diversificação de criativos (case +50/semana)", "→"]}, {"t": "h2", "x": "06 · A real mudança da meta"}, {"t": "raw", "title": "A real mudança da meta", "lines": ["A Meta mudou o jogo.", "A real mudança da meta: volume de criativos, segmentação na copy e variedade de criativos", "Depois do Andromeda, ela premia 3 coisas: volume de criativos, segmentação na própria copy e variedade. É exatamente o que você viu até aqui.", "Parte 3 · Execução", "Como fazer o criativo"]}, {"t": "h2", "x": "07 · Os 3 ingredientes do criativo"}, {"t": "raw", "title": "Os 3 ingredientes do criativo", "lines": ["Todo anúncio nasce de 3 coisas.", "Agora você já entende o porquê. Vamos pro como. Todo criativo nasce de 3 ingredientes, e junta os 3 você tem um anúncio que vende:", "Ângulo, Formato e Estrutura — os 3 ingredientes do criativo", "Ângulo — o QUE você fala (o jeito de atacar: os juros, o sonho, a prova, a urgência)", "Formato — COMO/ONDE você grava (o cenário: no carro, fundo preto, caixinha...)", "Estrutura — a ORDEM do que você fala (o roteiro: gancho, desenvolvimento, chamada)", "Vamos um por um, começando pelo formato."]}, {"t": "h2", "x": "08 · Formato · como você grava"}, {"t": "raw", "title": "Formato · como você grava", "lines": ["O formato decide se parece ou não anúncio.", "O formato é o jeito que você grava o vídeo. Parece detalhe, mas é ele que define se o seu vídeo tem cara de anúncio (e fica caro) ou cara de conteúdo (e fica barato).", "O formato tem que combinar com o seu público. De regata você fala com um público mais jovem; de camisa social, com outro. Grava do jeito que o seu cliente se identifica", "O importante é sempre o mesmo: não parecer anúncio", "E a melhor parte: você não precisa inventar nada. A gente já tem os formatos validados, prontos. É só escolher, copiar e fazer. Cada um tem vídeo aqui na aula ensinando a gravar", "Formato 01", "Tabela", "Tabela de preço/condição. Pro fim do funil.", "Formato 02", "Estático", "Imagem parada. Pro público quente.", "Formato 03", "Caixinha de perguntas", "Responde uma pergunta no story. Parece bastidor.", "Formato 04", "Tela dividida", "Você + um vídeo/print em cima. Reação.", "Formato 05", "No carro", "Falando no carro, espontâneo. Não parece anúncio.", "Formato 06", "Looping", "Vídeo curto em loop, prende a atenção.", "Formato 07", "Trivial", "Fazendo uma tarefa do dia a dia enquanto fala.", "Formato 08", "Fundo verde", "Chroma key, troca o cenário na edição.", "Formato 09", "Lofi", "De frente pra câmera, caseiro. A força tá na fala.", "Formato 10", "Apresentação quadro", "Explicando num quadro/tela. Autoridade.", "Sobre a tabela e o estático: eles sempre funcionaram, e funcionam. Mas pensa no time de futebol: o estático é um jogador do time, não o craque que ganha o jogo sozinho. Usar não é erro nenhum. O erro é botar SÓ ele em campo. Ele brilha no fim do funil, pra quem já te conhece (público quente), fechando a venda que os outros ângulos abriram."]}, {"t": "h2", "x": "09 · Ângulo · o que você fala"}, {"t": "raw", "title": "Ângulo · o que você fala", "lines": ["O mesmo consórcio. 6 jeitos de atacar.", "O ângulo é o jeito que você ataca o assunto no vídeo. E todo ângulo bate em uma de duas coisas: a dor (o problema que a pessoa vive hoje) ou o desejo (o resultado que ela quer).", "Ângulo de DOR", "\"Você já pagou um apartamento inteiro de aluguel. Só que é do seu senhorio.\"", "\"Seu carro vive no mecânico e a parcela do financiamento não acaba.\"", "Ângulo de DESEJO", "\"A chave da sua casa na mão, sem o banco levando o dobro.\"", "\"Carro zero na garagem sem pagar um centavo de juros.\"", "Por que vários ângulos? Lembra do time de futebol. Cada anúncio ataca de um ângulo diferente pra alcançar gente em momentos diferentes (os 5 níveis de consciência).", "A melhor parte: você não precisa inventar os ângulos. Tem um robô (a skill de anúncios de consórcio) que faz isso pra você:", "Você diz a modalidade (veículo, imóvel ou investimento) e o formato", "O robô te entrega 6 ganchos prontos: 3 de dor + 3 de desejo, cada um num nível de consciência", "Você escolhe o que mais bate com você", "E o robô já puxa o roteiro inteiro a partir dele", "Você só escolhe e grava. O ângulo, o robô entrega."]}, {"t": "h2", "x": "10 · Estrutura · a ordem do que você fala"}, {"t": "raw", "title": "Estrutura · a ordem do que você fala", "lines": ["O roteiro pronto. Você só lê e grava.", "A estrutura é a ordem do que você fala no vídeo. É o roteiro. E existe uma ordem testada que faz a pessoa assistir até o fim, e quanto mais gente assiste até o fim, mais barato a Meta entrega o seu anúncio.", "1", "Gancho", "Para o dedo e abre uma curiosidade que só fecha no fim", "2", "Problema", "Por que ela ainda não conseguiu o que quer", "3", "Solução + Prova", "Como o consórcio resolve, com um número ou caso real", "4", "Chamada", "\"Clica em saiba mais\", e uma frase de reforço", "Começa no meio. Sem \"oi pessoal, hoje vou falar sobre...\". Já entra na ideia", "Conteúdo primeiro, oferta por último. Uns 80% do vídeo é valor; a venda é quase um detalhe no fim", "Sem virar anúncio de repente. A chamada é continuação natural da conversa, não um pulo brusco", "Exemplo de roteiro pronto · imóvel", "\"Você já parou pra somar quanto já pagou de aluguel? Fiz essa conta com um cliente semana passada e o número deixou ele em choque, já te conto qual. A gente acha que aluguel é o jeito barato de morar enquanto não dá pra comprar. Só que aluguel é a parcela de uma casa que nunca vai ser sua. No consórcio é o contrário: essa mesma parcela vira a sua carta, sem os juros do financiamento, que fazem você pagar a casa duas vezes. E com lance dá pra antecipar a contemplação. A conta daquele cliente? Em cinco anos de aluguel ele tinha jogado fora o valor da entrada de dois apartamentos. Esse dinheiro que some todo mês pode estar construindo algo seu. Clica no saiba mais aqui embaixo que a gente faz essa conta com o seu aluguel.\"", "E de novo: você não monta isso na mão. O robô entrega o roteiro inteiro nessa estrutura, a partir do gancho que você escolheu. Você só lê e grava."]}, {"t": "h2", "x": "11 · Fechando a execução"}, {"t": "raw", "title": "Fechando a execução", "lines": ["3 ingredientes. Quase tudo pronto.", "Formato → você escolhe na caixinha (10 prontos, com vídeo ensinando)", "Ângulo → o robô te dá os ganchos", "Estrutura → o robô te dá o roteiro pronto", "Você não inventa quase nada. Escolhe o formato, escolhe o gancho, e grava. É isso."]}]}, {"id": "m15", "title": "Aula 15 · Mural de Modelagem", "stage": [], "lead": "\"Não inventa do zero o que já está validado. Modela.\"", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["Escala", "Mural de Modelagem", "Mural de modelagem.", "\"Não inventa do zero o que já está validado. Modela.\"", "O que vai viver aqui", "Anúncios validados que já rodaram e performaram", "Criativos prontos pra você modelar pro teu perfil", "Campanhas reais, com o que funcionou em cada uma", "🚧 Em construção · as primeiras peças entram em breve"]}]}]);

<script>
(function () {
  var STAGE_TARGET = ['instagram', 'qualificar', 'agendar', 'reuniao', 'proposta', 'fechar', 'pos-venda'];
  var KEYS = ['Nome', 'profissão', 'seu nome', 'cidade'];
  var KEYHELP = { 'Nome': 'Nome do cliente', 'profissão': 'Profissão do cliente', 'seu nome': 'Seu nome', 'cidade': 'Cidade' };
  S.push({ id: 'favoritos', title: 'Favoritos', stage: [], lead: 'As mensagens que você marcou com a estrela ficam aqui, prontas para copiar.', blocks: [] });
  var byId = {};
  S.forEach(function (s) { byId[s.id] = s; });
  var order = [], groupOf = {};
  GROUPS.forEach(function (g) { g[1].forEach(function (id) { order.push(id); groupOf[id] = g[0]; }); });
  var RAW = [], vals = {}, favs = [], current = 'inicio', pending = null, sel = 0, hits = [];

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function store(key, val) {
    try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
  }
  try { vals = JSON.parse(store('mv2:vals') || '{}') || {}; } catch (e) { vals = {}; }
  try { favs = JSON.parse(store('mv2:fav') || '[]') || []; } catch (e) { favs = []; }
  function fillHtml(s) {
    return esc(s).replace(/\{([^}]+)\}/g, function (m, k) {
      return vals[k] ? '<span class="fill">' + esc(vals[k]) + '</span>' : '<mark class="ph">{' + k + '}</mark>';
    });
  }
  function fillPlain(s) { return String(s).replace(/\{([^}]+)\}/g, function (m, k) { return vals[k] || m; }); }
  function keysOf(s) {
    var out = [], re = /\{([^}]+)\}/g, m;
    while ((m = re.exec(s))) { if (out.indexOf(m[1]) === -1) out.push(m[1]); }
    return out;
  }
  function raw(t) { RAW.push(t); return RAW.length - 1; }
  function saveVals() { store('mv2:vals', JSON.stringify(vals)); }
  function saveFavs() { store('mv2:fav', JSON.stringify(favs)); favN.textContent = favs.length; }
  var favN = document.getElementById('favN');

  function flat(sec) {
    var out = [];
    sec.blocks.forEach(function (b) {
      ['title', 'x', 'when', 'note', 'name', 'what', 'use'].forEach(function (k) { if (b[k]) out.push(b[k]); });
      (b.items || []).forEach(function (i) {
        if (typeof i === 'string') out.push(i);
        else if (Array.isArray(i)) out.push(i.join(' '));
        else out.push(i.h || '', i.p || '', (i.say || []).join(' '));
      });
      (b.groups || []).forEach(function (g) { out.push(g.label, g.items.join(' ')); });
      (b.rows || []).forEach(function (r) { out.push(r.join(' ')); });
      if (b.lines) out.push(b.lines.join(' '));
    });
    return out.join(' ');
  }
  var INDEX = [];
  S.forEach(function (s) {
    if (s.id === 'favoritos') return;
    INDEX.push({ sec: s.id, bi: -1, title: s.title, sub: groupOf[s.id], hay: norm(s.title + ' ' + (s.lead || '') + ' ' + flat(s)), kind: 0 });
    s.blocks.forEach(function (b, bi) {
      var title = b.title || b.name;
      if (b.t === 'steps') {
        b.items.forEach(function (i) {
          INDEX.push({ sec: s.id, bi: bi, title: i.h, sub: s.title + ' · passo', hay: norm(i.h + ' ' + (i.p || '') + ' ' + (i.say || []).join(' ')), kind: 1 });
        });
      } else if (title) {
        var sub = b.t === 'raw' ? 'Aula' : b.t === 'msg' ? 'Mensagem' : b.t === 'check' ? 'Checklist' : b.t === 'qs' ? 'Perguntas' : b.t === 'method' ? 'Método' : 'Dica';
        INDEX.push({ sec: s.id, bi: bi, title: title, sub: s.title + ' · ' + sub.toLowerCase(), hay: norm(title + ' ' + (b.x || '') + ' ' + (b.lines ? b.lines.join(' ') : '') + ' ' + (b.what || '') + ' ' + (b.use || '') + ' ' + (b.when || '')), kind: b.t === 'msg' ? 1 : 2 });
      }
    });
  });

  function ph(s) { return fillHtml(s); }
  function copyBtn(t, label) {
    return '<button type="button" class="btn sm" data-copy="' + raw(t) + '" data-label="' + (label || 'Copiar') + '">' + (label || 'Copiar') + '</button>';
  }
  function sayHtml(items) {
    return (items || []).map(function (t) {
      var n = raw(t);
      return '<div class="sayrow"><div class="say txt" data-r="' + n + '">' + fillHtml(t) + '</div><button type="button" class="btn sm" data-copy="' + n + '" data-label="Copiar">Copiar</button></div>';
    }).join('');
  }
  function star(sid, bi) {
    var k = sid + ':' + bi, on = favs.indexOf(k) !== -1;
    return '<button type="button" class="star" data-star="' + k + '" aria-pressed="' + on + '" aria-label="Favoritar esta mensagem" title="Favoritar"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.3 6.4 20.3l1.2-6.3L3 9.6l6.3-.8z"/></svg></button>';
  }
  function fieldsHtml(t) {
    var ks = keysOf(t);
    if (!ks.length) return '';
    return '<details class="fields"><summary>Preencher os campos desta mensagem (' + ks.length + ')</summary><div class="fgrid">' + ks.map(function (k) {
      return '<label>' + esc(k) + '<input type="text" data-key="' + esc(k) + '" value="' + esc(vals[k] || '') + '" autocomplete="off" placeholder="' + esc(k) + '"></label>';
    }).join('') + '</div></details>';
  }
  function checkCount(items, k0) {
    var n = 0;
    items.forEach(function (it, i) { if (store(k0 + ':' + i) === '1') n++; });
    return n;
  }

  function block(b, sid, bi) {
    switch (b.t) {
      case 'text': return '<p>' + ph(b.x) + '</p>';
      case 'h2': return '<h2>' + esc(b.x) + '</h2>';
      case 'tip': return '<div class="tip glass"><b>' + esc(b.title) + '</b>' + ph(b.x) + '</div>';
      case 'warn': return '<div class="warn glass"><b>' + esc(b.title) + '</b>' + ph(b.x) + '</div>';
      case 'msg':
        var n = raw(b.x);
        return '<section class="card glass"><div class="card-head"><div><h3>' + esc(b.title) + '</h3>' +
          (b.when ? '<p class="when">' + esc(b.when) + '</p>' : '') + '</div>' + star(sid, bi) + '</div>' +
          '<div class="bubble txt" data-r="' + n + '">' + fillHtml(b.x) + '</div>' + fieldsHtml(b.x) +
          '<div class="row"><button type="button" class="btn" data-copy="' + n + '" data-label="Copiar mensagem">Copiar mensagem</button></div>' +
          (b.note ? '<p class="note">' + ph(b.note) + '</p>' : '') + '</section>';
      case 'steps':
        return '<ol class="steps">' + b.items.map(function (i) {
          return '<li><div class="body"><h4>' + esc(i.h) + '</h4>' + (i.p ? '<p>' + ph(i.p) + '</p>' : '') + sayHtml(i.say) + '</div></li>';
        }).join('') + '</ol>';
      case 'qs':
        return '<section class="card glass"><h3>' + esc(b.title) + '</h3>' + b.groups.map(function (g) {
          return '<div class="qgroup"><b>' + esc(g.label) + '</b><ul class="qs">' + g.items.map(function (q) { return '<li>' + ph(q) + '</li>'; }).join('') + '</ul></div>';
        }).join('') + '</section>';
      case 'table':
        return '<div class="tablewrap glass"><table><thead><tr>' + b.head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + b.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + ph(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
      case 'check':
        var k0 = 'mv:' + sid + ':' + bi;
        return '<section class="card glass" data-ck="' + k0 + '" data-total="' + b.items.length + '"><div class="card-head"><h3>' + esc(b.title) + '</h3><span class="count">' + checkCount(b.items, k0) + ' de ' + b.items.length + '</span></div><div class="check">' + b.items.map(function (it, i) {
          var k = k0 + ':' + i;
          return '<label><input type="checkbox" data-k="' + k + '"' + (store(k) === '1' ? ' checked' : '') + '><span>' + ph(it) + '</span></label>';
        }).join('') + '</div></section>';
      case 'method':
        return '<section class="card glass"><h3>' + esc(b.name) + '</h3><p>' + ph(b.what) + '</p><p><b>Como o time usa.</b> ' + ph(b.use) + '</p>' +
          (b.link ? '<p class="note"><a href="' + esc(b.link) + '" target="_blank" rel="noopener noreferrer">' + esc(b.label) + '</a></p>' : '') + '</section>';
      case 'raw':
        return '<div class="raw glass">' + b.lines.map(function (l) {
          var k = l.length <= 52 && !/[.:?!,;]$/.test(l);
          return '<p' + (k ? ' class="k"' : '') + '>' + esc(l) + '</p>';
        }).join('') + '</div>';
      case 'src':
        return '<ul class="src">' + b.items.map(function (i) { return '<li><a href="' + esc(i[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(i[0]) + '</a></li>'; }).join('') + '</ul>';
    }
    return '';
  }

  var view = document.getElementById('view');
  var navlist = document.getElementById('navlist');
  var stagesEl = document.getElementById('stages');
  var crumb = document.getElementById('crumb');
  var pager = document.getElementById('pager');
  var navEl = document.getElementById('nav');
  var menuBtn = document.getElementById('menuBtn');
  var menuScrim = document.getElementById('menuScrim');
  var scrim = document.getElementById('scrim');
  var modal = document.getElementById('modal');

  function renderNav() {
    navlist.innerHTML = GROUPS.map(function (g) {
      return '<div class="group"><h3>' + esc(g[0]) + '</h3>' + g[1].map(function (id) {
        return '<button type="button" class="item" data-go="' + id + '"' + (id === current ? ' aria-current="page"' : '') + '>' + esc(byId[id].title) + '</button>';
      }).join('') + '</div>';
    }).join('');
  }
  function renderStages(sec) {
    stagesEl.innerHTML = STAGES.map(function (s, i) {
      var on = (sec.stage || []).indexOf(i) !== -1;
      return '<button type="button" class="stage' + (on ? ' on' : '') + '" data-stage="' + i + '"' + (on ? ' aria-current="step"' : '') + '>' + esc(s) + '</button>';
    }).join('');
  }
  function renderPager(id) {
    var i = order.indexOf(id), p = byId[order[i - 1]], n = byId[order[i + 1]];
    pager.innerHTML = (p ? '<button type="button" class="glass" data-go="' + p.id + '"><small>Anterior</small><b>' + esc(p.title) + '</b></button>' : '<span></span>') +
      (n ? '<button type="button" class="glass" data-go="' + n.id + '"><small>Próxima</small><b>' + esc(n.title) + '</b></button>' : '');
  }
  function hubHtml() {
    return '<div class="hub">' + S.filter(function (s) { return s.id !== 'inicio' && s.id !== 'favoritos'; }).map(function (s) {
      var st = (s.stage || []).length ? STAGES[s.stage[0]] : groupOf[s.id];
      return '<button type="button" class="tile glass" data-go="' + s.id + '"><i>' + esc(st) + '</i><b>' + esc(s.title) + '</b><span>' + esc(s.lead || '') + '</span></button>';
    }).join('') + '</div>';
  }
  function favHtml() {
    var out = [];
    favs.forEach(function (k) {
      var p = k.split(':'), s = byId[p[0]], b = s && s.blocks[+p[1]];
      if (b) out.push('<div class="blk">' + block(b, p[0], +p[1]) + '</div>');
    });
    return out.length ? out.join('') : '<div class="empty glass">Nenhuma mensagem favorita ainda. Abra uma seção e toque na estrela de uma mensagem para guardá-la aqui.</div>';
  }

  function show(id) {
    if (!byId[id]) id = 'inicio';
    current = id;
    RAW = [];
    var sec = byId[id], body;
    if (id === 'favoritos') body = favHtml();
    else {
      body = sec.blocks.map(function (b, i) { return '<div class="blk" data-b="' + i + '">' + block(b, id, i) + '</div>'; }).join('');
      if (id === 'inicio') body = hubHtml() + body;
    }
    view.innerHTML = '<h1>' + esc(sec.title) + '</h1>' + (sec.lead ? '<p class="lead">' + esc(sec.lead) + '</p>' : '') + body;
    crumb.innerHTML = 'Manual de vendas / ' + esc(groupOf[id]) + ' / <b>' + esc(sec.title) + '</b>';
    document.title = sec.title + ' | Manual de Vendas ARVI';
    renderStages(sec);
    renderNav();
    renderPager(id);
    closeMenu();
    if (pending !== null) {
      var el = view.querySelector('.blk[data-b="' + pending + '"]');
      pending = null;
      if (el) {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        el.classList.add('flash');
        setTimeout(function () { el.classList.remove('flash'); }, 2000);
        return;
      }
    }
    window.scrollTo(0, 0);
  }
  function go(id) {
    if (location.hash === '#' + id) show(id); else location.hash = id;
  }
  function closeMenu() {
    navEl.classList.remove('open'); menuScrim.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  /* copiar */
  function flash(btn, label, ok) {
    var old = btn.getAttribute('data-label') || 'Copiar';
    btn.textContent = label;
    if (ok) btn.classList.add('done');
    setTimeout(function () { btn.textContent = old; btn.classList.remove('done'); }, 2000);
  }
  function fallbackCopy(text, btn, label, ok0) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    flash(btn, ok ? label : 'Selecione e copie', ok);
  }
  function doCopy(btn) {
    var text = fillPlain(RAW[+btn.getAttribute('data-copy')] || '');
    var miss = keysOf(text).length;
    var label = miss ? 'Copiado, faltam ' + miss + ' campo' + (miss > 1 ? 's' : '') : 'Copiado';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(btn, label, true); }, function () { fallbackCopy(text, btn, label); });
    } else { fallbackCopy(text, btn, label); }
  }
  function refresh(except) {
    var els = document.querySelectorAll('.txt');
    for (var i = 0; i < els.length; i++) els[i].innerHTML = fillHtml(RAW[+els[i].getAttribute('data-r')] || '');
    var ins = document.querySelectorAll('input[data-key]');
    for (var j = 0; j < ins.length; j++) { if (ins[j] !== except) ins[j].value = vals[ins[j].getAttribute('data-key')] || ''; }
  }

  /* janelas */
  function openModal(html) {
    modal.innerHTML = html;
    scrim.classList.add('open');
  }
  function closeModal() { scrim.classList.remove('open'); }
  function openSearch() {
    openModal('<h3>Buscar no manual</h3><input type="search" class="search-in" id="sq" placeholder="Ex.: preço, instagram, não tenho dinheiro" autocomplete="off" aria-label="Buscar no manual"><div class="results" id="res" role="listbox"></div>');
    var q = document.getElementById('sq');
    q.addEventListener('input', function () { runSearch(q.value); });
    runSearch('');
    setTimeout(function () { q.focus(); }, 30);
  }
  function runSearch(v) {
    var words = norm(v).split(/\s+/).filter(Boolean);
    hits = INDEX.filter(function (e) { return words.every(function (w) { return e.hay.indexOf(w) !== -1; }); });
    if (words.length) {
      hits.sort(function (a, b) {
        var ta = words.every(function (w) { return norm(a.title).indexOf(w) !== -1; }) ? 0 : 1;
        var tb = words.every(function (w) { return norm(b.title).indexOf(w) !== -1; }) ? 0 : 1;
        return ta - tb || a.kind - b.kind;
      });
    } else { hits = INDEX.filter(function (e) { return e.bi === -1; }); }
    hits = hits.slice(0, 40);
    sel = 0;
    drawResults();
  }
  function drawResults() {
    var r = document.getElementById('res');
    if (!r) return;
    r.innerHTML = hits.length ? hits.map(function (h, i) {
      return '<button type="button" class="res' + (i === sel ? ' on' : '') + '" data-hit="' + i + '" role="option"><b>' + esc(h.title) + '</b><span>' + esc(h.sub) + '</span></button>';
    }).join('') : '<p class="empty">Nada com esse termo. Tente uma palavra mais curta.</p>';
    var on = r.querySelector('.res.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
  }
  function pick(i) {
    var h = hits[i];
    if (!h) return;
    closeModal();
    pending = h.bi >= 0 ? h.bi : null;
    go(h.sec);
  }
  function openData() {
    openModal('<h3>Meus dados</h3><p class="note">Preencha uma vez. O nome, a profissão e a cidade entram sozinhos em todas as mensagens. Fica salvo só neste navegador.</p><div class="mfields">' + KEYS.map(function (k) {
      return '<label>' + esc(KEYHELP[k]) + '<input type="text" data-key="' + esc(k) + '" value="' + esc(vals[k] || '') + '" autocomplete="off"></label>';
    }).join('') + '</div><div class="row"><button type="button" class="btn" data-close="1">Pronto</button></div>');
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;
    var c;
    if ((c = t.closest('[data-copy]'))) { doCopy(c); return; }
    if ((c = t.closest('[data-star]'))) {
      var k = c.getAttribute('data-star'), i = favs.indexOf(k);
      if (i === -1) favs.push(k); else favs.splice(i, 1);
      saveFavs();
      if (current === 'favoritos') show('favoritos'); else c.setAttribute('aria-pressed', i === -1 ? 'true' : 'false');
      return;
    }
    if ((c = t.closest('[data-hit]'))) { pick(+c.getAttribute('data-hit')); return; }
    if ((c = t.closest('[data-go]'))) { go(c.getAttribute('data-go')); return; }
    if ((c = t.closest('[data-stage]'))) { go(STAGE_TARGET[+c.getAttribute('data-stage')]); return; }
    if (t.closest('#openSearch')) { openSearch(); return; }
    if (t.closest('#openData')) { openData(); return; }
    if (t.closest('[data-close]') || t === scrim) { closeModal(); return; }
    if (t.closest('#menuBtn')) {
      var open = navEl.classList.toggle('open');
      menuScrim.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    if (t === menuScrim) closeMenu();
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-key');
    if (k) { vals[k] = e.target.value.trim(); if (!vals[k]) delete vals[k]; saveVals(); refresh(e.target); }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (!k) return;
    store(k, e.target.checked ? '1' : '0');
    var card = e.target.closest('[data-ck]');
    if (card) {
      var n = card.querySelectorAll('input:checked').length;
      card.querySelector('.count').textContent = n + ' de ' + card.getAttribute('data-total');
    }
  });
  document.addEventListener('pointermove', function (e) {
    var t = e.target.closest && e.target.closest('.tile');
    if (!t) return;
    var r = t.getBoundingClientRect();
    t.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    t.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
  document.addEventListener('keydown', function (e) {
    var open = scrim.classList.contains('open');
    if (e.key === 'Escape') { if (open) closeModal(); else closeMenu(); return; }
    var typing = /^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''));
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing && !open)) { e.preventDefault(); openSearch(); return; }
    if (open && document.getElementById('res')) {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); drawResults(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); drawResults(); }
      else if (e.key === 'Enter') { e.preventDefault(); pick(sel); }
    }
  });
  window.addEventListener('hashchange', function () { show(location.hash.replace('#', '')); });
  favN.textContent = favs.length;
  show(location.hash.replace('#', '') || 'inicio');
})();
</script>
</body></html>
