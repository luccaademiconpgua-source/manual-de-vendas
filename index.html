<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#25070D"><meta name="description" content="Manual de vendas do time ARVI Capital: mensagens prontas, passo a passo e scripts."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%234A0D18%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2740%27 text-anchor=%27middle%27 fill=%27%23E1C16A%27 font-family=%27serif%27 font-weight=%27700%27%3EA%3C/text%3E%3C/svg%3E">
<title>Manual de Vendas ARVI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Vidro líquido sobre verde floresta, na paleta do Manual de Uso da Marca ARVI: verde floresta, verde secundário, sálvia, champagne e off-white. Só fontes sem serifa: Montserrat nos títulos, Inter no texto. */
:root {
  --bg0: #0E2119;
  --bordo: #193D31;
  --ruby: #2C5644;
  --rose: #A6B8A0;
  --coral: #BE9E63;
  --amber: #BE9E63;
  --gold: #BE9E63;
  --ink: #F6F4EC;
  --muted: #D3DACD;
  --faint: #A6B8A0;
  --edge: rgba(246, 244, 236, 0.28);
  --tint: rgba(14, 33, 25, 0.5);
  --ok: #A6B8A0;
  --warn: #BE9E63;
  --focus: #BE9E63;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  background: linear-gradient(160deg, #0E2119 0%, #193D31 52%, #0A1812 100%);
  background-color: var(--bg0);
  font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.65;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #0E2119; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: var(--gold); }

/* manchas de cor ao fundo */
.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.75; }
.o1 { width: 560px; height: 560px; left: -160px; top: -140px; background: #2C5644; opacity: 0.95; animation: d1 36s ease-in-out infinite alternate; }
.o2 { width: 460px; height: 460px; right: -120px; top: 12%; background: #A6B8A0; opacity: 0.22; animation: d2 42s ease-in-out infinite alternate; }
.o3 { width: 540px; height: 540px; left: 28%; bottom: -240px; background: #2C5644; opacity: 0.8; animation: d3 48s ease-in-out infinite alternate; }
.o4 { width: 340px; height: 340px; right: 18%; bottom: 8%; background: #BE9E63; opacity: 0.16; animation: d1 40s ease-in-out infinite alternate-reverse; }
@keyframes d1 { to { transform: translate(90px, 70px) scale(1.12); } }
@keyframes d2 { to { transform: translate(-80px, 90px) scale(0.92); } }
@keyframes d3 { to { transform: translate(110px, -60px) scale(1.1); } }

/* vidro */
.glass {
  background:
    radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 55%),
    linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03)),
    var(--tint);
  -webkit-backdrop-filter: blur(20px) saturate(170%);
  backdrop-filter: blur(20px) saturate(170%);
  border: 1px solid var(--edge);
  border-radius: 24px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -1px 0 rgba(255, 255, 255, 0.08);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: #14322A; }
}
@media (prefers-reduced-transparency: reduce) {
  .glass { background: #14322A; -webkit-backdrop-filter: none; backdrop-filter: none; }
}

.app { position: relative; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); max-width: 1500px; margin: 0 auto; }

/* barra lateral */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: start; height: calc(100vh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 16px; }
.brand { padding: 0 8px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: 0.14em; color: #F6F4EC; }
.brand em { font-style: normal; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 10.5px; letter-spacing: 0.22em; color: #A6B8A0; margin-top: 2px; }
.brand span { font-size: 13px; color: var(--muted); }
.group { display: flex; flex-direction: column; gap: 2px; }
.group h3 { margin: 0 0 4px; padding: 0 10px; font-size: 12.5px; font-weight: 600; color: var(--gold); }
.item { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 14px; padding: 9px 12px; cursor: pointer; font-size: 14px; color: var(--ink); transition: background 0.18s, border-color 0.18s; }
.item:hover { background: rgba(255, 255, 255, 0.10); }
.item[aria-current="page"] { background: rgba(190, 158, 99, 0.2); border-color: rgba(190, 158, 99, 0.7); font-weight: 600; }
.tag { margin: auto 0 0; padding: 14px 8px 0; border-top: 1px solid rgba(246, 244, 236, 0.2); font-style: italic; font-weight: 400; font-size: 14px; line-height: 1.45; color: #BE9E63; }

/* coluna principal */
.main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 20; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border-radius: 22px; }
.stepper { flex: 1 1 420px; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; }
.stepper::-webkit-scrollbar { display: none; }
.stage { flex-shrink: 0; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 999px; padding: 8px 16px; font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--muted); transition: transform 0.18s, background 0.18s; }
.stage:hover { background: rgba(255, 255, 255, 0.16); color: var(--ink); transform: translateY(-1px); }
.stage.on { background: #BE9E63; border-color: #E3C98C; color: #193D31; font-weight: 700; box-shadow: none; }
.actions { display: flex; gap: 8px; align-items: center; }
.pill { background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: background 0.18s; }
.pill:hover { background: rgba(255, 255, 255, 0.2); }
.pill kbd { font: inherit; font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: rgba(255, 255, 255, 0.16); color: var(--muted); }
.pill svg { width: 16px; height: 16px; }
.menu-btn { display: none; }
.crumb { font-size: 13px; color: var(--muted); padding: 0 6px; }
.crumb b { color: var(--ink); font-weight: 600; }

.sheet { display: flex; flex-direction: column; gap: 22px; max-width: 900px; padding: 0 6px; }
.sheet h1 { margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(30px, 5vw, 48px); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; }
.lead { margin: 0; font-size: 17px; color: var(--muted); max-width: 66ch; }
.sheet h2 { margin: 14px 0 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.2; text-wrap: balance; padding-bottom: 10px; background: linear-gradient(90deg, #BE9E63, rgba(190, 158, 99, 0)) bottom / 100% 1.5px no-repeat; }
.sheet p { margin: 0; max-width: 70ch; }
.blk { min-width: 0; }
.blk.flash > * { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px var(--amber), 0 0 40px rgba(255, 180, 59, 0.6); } 100% { box-shadow: none; } }

/* blocos */
.tip, .warn { padding: 16px 20px; max-width: 72ch; border-radius: 18px; border-left: 4px solid #A6B8A0; }
.warn { border-left-color: #BE9E63; background: radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 55%), linear-gradient(135deg, rgba(190, 158, 99, 0.26), rgba(190, 158, 99, 0.08)), var(--tint); }
.tip b, .warn b { display: block; margin-bottom: 2px; }
.warn b { color: #E3C98C; }
.tip b { color: var(--gold); }
.card { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; border-radius: 22px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card h3 { margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25; }
.when { margin: 0; font-size: 13.5px; color: var(--muted); }
.bubble, .say { background: rgba(255, 255, 255, 0.13); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 20px 20px 20px 6px; padding: 14px 18px; white-space: pre-line; max-width: 62ch; line-height: 1.6; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28); }
.say { font-size: 14px; padding: 10px 14px; border-radius: 16px 16px 16px 5px; }
.ph { background: rgba(190, 158, 99, 0.24); color: #F6F4EC; border-radius: 6px; padding: 0 4px; font-style: normal; border-bottom: 1px dashed #BE9E63; }
.fill { background: rgba(166, 184, 160, 0.26); color: #E4EBDF; border-radius: 6px; padding: 0 4px; font-weight: 500; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid rgba(246, 244, 236, 0.9); background: #F6F4EC; color: #193D31; border-radius: 999px; padding: 9px 20px; font-family: 'Montserrat', sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: transform 0.15s, background 0.15s; }
.btn:hover { transform: translateY(-2px); background: #FFFFFF; }
.btn:active { transform: translateY(0) scale(0.97); }
.btn.sm { padding: 6px 14px; font-size: 12.5px; }
.btn.done { background: #A6B8A0; border-color: #A6B8A0; color: #193D31; }
.star { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; color: var(--muted); transition: transform 0.15s, background 0.15s; }
.star:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.2); }
.star svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: #193D31; background: #BE9E63; border-color: #E3C98C; }
.star[aria-pressed="true"] svg { fill: currentColor; }
.note { font-size: 13px; color: var(--muted); max-width: 62ch; }
details.fields { max-width: 62ch; }
details.fields summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--gold); padding: 4px 0; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; padding-top: 8px; }
.fgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.fgrid input, .search-in { background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 12px; padding: 9px 12px; color: var(--ink); width: 100%; }
.fgrid input::placeholder, .search-in::placeholder { color: var(--faint); }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
ol.steps > li { counter-increment: s; position: relative; padding: 0 0 24px 54px; border-left: 2px solid rgba(255, 255, 255, 0.22); margin-left: 17px; }
ol.steps > li:last-child { border-left-color: transparent; padding-bottom: 0; }
ol.steps > li::before { content: counter(s); position: absolute; left: -19px; top: -3px; width: 36px; height: 36px; border-radius: 50%; background: #2C5644; border: 1.5px solid #BE9E63; color: #F6F4EC; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 15px; display: grid; place-items: center; }
ol.steps h4 { margin: 0 0 4px; font-size: 16px; font-weight: 600; line-height: 1.35; }
ol.steps .body { display: flex; flex-direction: column; gap: 8px; }
.sayrow { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.qgroup { display: flex; flex-direction: column; gap: 6px; }
.qgroup b { font-weight: 600; color: var(--gold); }
ul.qs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; max-width: 68ch; }
.tablewrap { overflow-x: auto; border-radius: 20px; padding: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 11px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.16); min-width: 120px; }
th { font-weight: 600; color: var(--gold); }
tr:last-child td { border-bottom: 0; }
.check { display: flex; flex-direction: column; gap: 2px; }
.check label { display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; cursor: pointer; }
.check input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 8px; border: 1.5px solid rgba(255, 255, 255, 0.55); background: rgba(0, 0, 0, 0.25); flex-shrink: 0; cursor: pointer; display: grid; place-items: center; transition: background 0.15s; }
.check input:checked { background: #BE9E63; border-color: #F6F4EC; }
.check input:checked::after { content: ""; width: 6px; height: 11px; border: solid #193D31; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check label:has(input:checked) span { color: var(--faint); text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, 0.4); }
.count { font-size: 12.5px; font-weight: 600; color: var(--gold); white-space: nowrap; padding-top: 6px; }
.sheet h1, .sheet h2, .card h3, .tile b, .brand b, .modal h3 { font-variant-numeric: lining-nums; }
.src li { margin-bottom: 4px; }
.raw { padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; border-radius: 22px; }
.raw p { margin: 0; max-width: 68ch; }
.raw p.k { font-weight: 600; color: var(--gold); margin-top: 6px; }
.raw p.k:first-child { margin-top: 0; }

/* hub da página inicial */
.hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.tile { text-align: left; cursor: pointer; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; border-radius: 22px; position: relative; transition: transform 0.2s, border-color 0.2s; --mx: 20%; --my: 0%; }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(240px 160px at var(--mx) var(--my), rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0)); opacity: 0; transition: opacity 0.2s; }
.tile:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.6); }
.tile:hover::after { opacity: 1; }
.tile b { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; }
.tile span { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile i { font-style: normal; font-size: 12px; font-weight: 600; color: #193D31; background: #BE9E63; border-radius: 999px; padding: 2px 10px; align-self: flex-start; }
.empty { padding: 24px; text-align: center; color: var(--muted); border-radius: 20px; }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 900px; padding: 8px 6px 0; }
.pager button { text-align: left; cursor: pointer; padding: 14px 18px; border-radius: 18px; max-width: 100%; transition: transform 0.2s; }
.pager button:hover { transform: translateY(-3px); }
.pager small { display: block; color: var(--muted); font-size: 12px; }
.pager b { font-weight: 600; }

/* janela de busca e de dados */
.scrim { position: fixed; inset: 0; z-index: 80; background: rgba(20, 3, 8, 0.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; padding: max(10vh, 24px) 16px 16px; }
.scrim.open { display: flex; }
.modal { width: min(640px, 100%); max-height: 78vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: pop 0.2s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
.modal h3 { margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 22px; }
.results { display: flex; flex-direction: column; gap: 4px; }
.res { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 14px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.res b { font-weight: 600; font-size: 14.5px; }
.res span { font-size: 12.5px; color: var(--muted); }
.res.on, .res:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.34); }
.mfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.mfields label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.mfields input { background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 12px; padding: 10px 12px; color: var(--ink); width: 100%; }
.scrim-menu { z-index: 40; }

@media (max-width: 1500px) { .stage { padding: 8px 12px; font-size: 13px; } .pill kbd { display: none; } .actions .lbl { display: none; } .actions .pill { padding: 8px 12px; } #favBtn kbd { display: inline; } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 70; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); width: min(320px, calc(100vw - 24px)); transform: translateX(-120%); transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .side.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .bar { padding: 10px; gap: 8px; position: static; }
  .menu-btn { order: 0; }
  .actions { order: 1; margin-left: auto; }
  .stepper { order: 2; flex: 1 1 100%; gap: 5px; padding: 0; }
  .stage { padding: 7px 11px; font-size: 12.5px; }
  .actions .lbl { display: none; }
  .pill kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .orb, .modal, .sheet { animation: none; }
  html { scroll-behavior: auto; }
  .btn, .tile, .pager button, .stage, .side { transition: none; }
}
</style>

<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i></div>
<div class="app">
  <aside class="side glass" id="nav" aria-label="Seções do manual">
    <div class="brand"><b>ARVI</b><em>CONSULTORIA PATRIMONIAL</em><span>Manual de vendas do time</span></div>
    <nav id="navlist" style="display:flex;flex-direction:column;gap:14px"></nav>
    <div class="tag">Estratégia para transformar projetos em patrimônio.</div>
  </aside>
  <main class="main">
    <header class="bar glass">
      <button type="button" class="pill menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="lbl">Menu</span></button>
      <nav class="stepper" id="stages" aria-label="Etapas da venda"></nav>
      <div class="actions">
        <button type="button" class="pill" id="openSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Buscar</span><kbd>/</kbd></button>
        <button type="button" class="pill" id="openData"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6 8-6s7 1.5 8 6"/></svg><span class="lbl">Meus dados</span></button>
        <button type="button" class="pill" data-go="favoritos" id="favBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.3 6.4 20.3l1.2-6.3L3 9.6l6.3-.8z"/></svg><span class="lbl">Favoritos</span><kbd id="favN">0</kbd></button>
      </div>

</div>

<script>
const STAGES = ['Prospectar', 'Qualificar', 'Agendar', 'Reunião', 'Proposta', 'Fechar', 'Pós-venda'];
const GROUPS = [
  ['Começar', ['inicio','favoritos']],

  blocks: [
    h2('Regras simples'),
    steps([

      { h: 'Falou, mostre', p: 'Se citou resultado, mostre o comprovante com nome e valores sensíveis borrados e com autorização do cliente. Se citou notícia, mostre a manchete.' },
      { h: 'Uma frase por tela, texto limpo', p: 'Letra simples, bom contraste, câmera limpa e boa luz. A mensagem importa mais do que a foto.' },
      { h: 'O último stories é sempre a chamada', p: 'Peça uma palavra para comentar ou responder. Quem vê sabe exatamente o que fazer.' }

    table(['Tela', 'O que entra', 'Exemplo'], [
      ['1. Gancho', 'Uma pergunta ou um fato que faz parar.', 'Você sabe quanto custa de verdade o carro que quer?'],
      ['2. Desenvolvimento', 'A história ou a conta, em linguagem simples.', 'Mostro como planejar a compra em etapas.'],
      ['3. Prova', 'Print, conta ou enquete.', 'Enquete: qual parcela cabe no seu orçamento?'],
      ['4. Autoridade', 'Por que ouvir você.', 'Eu uso consórcio no meu planejamento há anos.'],
      ['5. Chamada', 'A palavra para comentar ou responder.', 'Comenta CARRO que eu te explico.']

    h2('Quando alguém responde ao stories'),

S.push({

    steps([

      { h: 'Categoria: consultoria', p: 'Escolha uma categoria simples, de consultoria. Evite categorias de investimentos ou consultoria financeira, que costumam exigir mais comprovação.' },

    msg('Descrição do perfil',
      'Campo de descrição. Cabe em poucas linhas.',
      'Sou {seu nome}, consultor de consórcio em {cidade}. Ajudo pessoas e empresas a planejar a compra de imóveis, veículos e outros bens de forma organizada. Atendo online e presencialmente. Fale comigo pelo WhatsApp.',
      'Sem promessas de contemplação, de preço ou de resultado.'),
    msg('Pedido de avaliação',
      'Para quem já está satisfeito com o atendimento, depois da primeira parcela paga.',

    warn('Antes de criar', 'Confirme com a gestão da Ademicon se existe regra sobre uso do nome da administradora e sobre as avaliações. Se existir, siga a regra.')
  ]
});

S.push({

    msg('Ajustar o texto à sua voz',

    warn('A IA não substitui o compliance', 'Se uma resposta prometer contemplação, prazo ou ganho garantido, descarte. O que vale é o contrato e as regras da Ademicon.')
