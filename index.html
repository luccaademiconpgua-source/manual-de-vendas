uanto espera."}, {"t": "msg", "title": "Investigação comparativa", "when": "", "x": "Compare [minha administradora] com [concorrente]. Sou consultor, preciso de dados estatísticos pra provar pro cliente que sou o melhor.\nHack 5 · PDF na hora\nPega o que ele gerou e entrega em PDF\nQuebra o galho. Pra PDF profissional, tem ferramenta melhor. Mostro lá na frente."}, {"t": "msg", "title": "Gerar PDF", "when": "", "x": "Transforme isso em PDF."}, {"t": "h2", "x": "12 · Plus · R$ 39"}, {"t": "raw", "title": "Plus · R$ 39", "lines": ["Única ferramenta paga que recomendo na mentoria.", "Plano Personal. Não é o Business", "R$ 39 por mês. Retorna 10, 30, 60 vezes", "Libera projetos, pastas e modelo melhor"]}, {"t": "h2", "x": "13 · Atenção · ela alucina"}, {"t": "raw", "title": "Atenção · ela alucina", "lines": ["Fala errado com convicção. Seja crítico.", "Ela inventa com cara de quem sabe", "Pra validar, pergunta: \"quem está certo, quem está errado?\"", "Apego emocional é real. Tem caso de mulher que casou com o ChatGPT", "Confira tudo. Questiona tudo. O sócio é seu. Quem manda é você.", "Lição de casa", "Baixar o app oficial do ChatGPT (celular + computador)", "Logar com o mesmo e-mail nos dois (iPhone: e-mail do iCloud)", "Preencher Personalização completa (Apelido, Ocupação, Mais sobre você)", "Colar o texto das Instruções Personalizadas", "Forçar uma memória (\"salva isso na sua memória\")", "Postar nos stories e marcar @juliankinol", "Assinar ChatGPT Plus R$ 39 (Personal)", "\"Esse sócio não cobra 30, 40, 50%.", "Vai ser teu parceiro pro resto da vida.\""]}]}, {"id": "m02", "title": "Aula 02 · Robôs e Follow-up Brasileiro", "stage": [], "lead": "\"Aqui está o gargalo da sua venda. 80% acontecem depois do 5º follow-up — e quase ninguém chega lá.\"", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["102 min", "Robôs e Follow-up Brasileiro", "\"Aqui está o gargalo da sua venda. 80% acontecem depois do 5º follow-up — e quase ninguém chega lá.\""]}, {"t": "h2", "x": "01 · Abertura"}, {"t": "raw", "title": "Abertura", "lines": ["Marketing digital é ocupar espaço na cabeça do cliente.", "Não é postar consórcio. É existir lá dentro antes da decisão", "Quando ele decidir fechar, vai lembrar de você primeiro", "Tira print dessa aula e marca @juliankinol no story. Eu reposto"]}, {"t": "h2", "x": "02 · O que é um robô"}, {"t": "raw", "title": "O que é um robô", "lines": ["Robô nada mais é do que a IA treinada pra fazer uma coisa só.", "Você quer todo o poder da IA. Mas ela só é boa de uma coisa", "Então cria um robô pra cada função: follow-up, prospecção, persona, objeção, post", "Robô já vem com instrução, contexto e treinamento embutidos", "Atenção: confere com quem você tá falando. Se mandou no chat normal e não no robô, a resposta sai doida"]}, {"t": "h2", "x": "03 · O gargalo da sua venda"}, {"t": "raw", "title": "O gargalo da sua venda", "lines": ["80% das vendas acontecem depois do 5º follow-up.", "44%", "desistem na primeira tentativa", "48%", "nunca fazem follow-up nenhum", "2%", "das vendas saem no primeiro dia", "80%", "saem entre o 5º e o 10º contato", "Quem é bom no X1 tá operando com 2% do potencial. O resto é onde o jogo acontece", "Confundimos persistência com insistência. Insistência é mandar a mesma mensagem, fazer disparo", "Persistência é o vendedor consultivo: conduz, personaliza, sabe o que tá fazendo"]}, {"t": "h2", "x": "04 · O jeitinho brasileiro · áudio mudo"}, {"t": "raw", "title": "O jeitinho brasileiro · áudio mudo", "lines": ["15 segundos de silêncio. Mensagem doida. Cliente responde.", "Pega aquele cliente quente que sumiu", "Grava áudio em silêncio + manda: \"foi por isso que falei aquele dia\"", "O cliente fica curioso. Responde em minutos: \"não ouvi nada\"", "Aí você puxa: \"ah, mandei errado. Aproveitando...\" e a conversa tá reaberta"]}, {"t": "msg", "title": "Robô · Follow-up Brasileiro", "when": "", "x": "Sou consultor de consórcio especialista em [investimento / imobiliário / caminhão]. Preciso de ideias de follow-up criativos pra reativar minha lista de clientes parados."}, {"t": "h2", "x": "05 · Procura-se · meme personalizado"}, {"t": "raw", "title": "Procura-se · meme personalizado", "lines": ["O cliente percebe que você gastou tempo com ele. Aí ele responde.", "Tira print da foto de perfil do cliente", "Joga no robô do meme. Ele gera um cartaz \"Procura-se\" com o nome e o objetivo do cliente", "Manda: \"Procura-se [João], última vez visto querendo consórcio. Se tiver vivo, dá um sinal.\"", "Só com cliente que você tem intimidade. Senão dá ruim"]}, {"t": "msg", "title": "Robô · Criador de Meme", "when": "", "x": "Me ajude a criar um meme de cartaz X1 personalizado pra um cliente. Já te mando o nome dele, o objetivo e a foto."}, {"t": "h2", "x": "06 · 5 mensagens que reabrem conversa"}, {"t": "raw", "title": "5 mensagens que reabrem conversa", "lines": ["Foge do padrão dos 95%. Ganha o resultado dos 5%.", "01 · Oportunidade passando", "\"Entrou cliente no mesmo perfil que o teu\"", "\"João, entrou um cliente agora com o mesmo perfil que você. Lembrei da nossa última conversa. Ainda faz sentido olhar essa carta?\"", "02 · Exclusividade", "\"Tô segurando essa vaga pra você\"", "\"Separei uma estratégia específica pra você. Preciso saber se é prioridade. Tô com outro cliente esperando. Tô segurando tua vaga.\"", "03 · Sinceridade direta", "\"Você comentou que queria X. O que mudou?\"", "\"Na nossa última conversa você comentou que queria estruturar o investimento usando consórcio. O que mudou de lá pra cá? Me fala o que tá pegando.\"", "04 · Fechamento de mês", "\"Tô fechando meu planejamento\"", "\"Tô fechando meu planejamento de clientes essa semana. Seu nome ainda tá na minha lista de prioridade. Antes de eu encerrar: a gente estrutura isso agora?\"", "05 · Conexão lembrada", "Comentário sobre conteúdo recente", "\"Vi seu post sobre [tema]. Achei muito bom. Aliás, lembrei do que conversamos sobre [objetivo do cliente]. Quando fica bom pra você?\""]}, {"t": "h2", "x": "07 · Instagram é canal de venda"}, {"t": "raw", "title": "Instagram é canal de venda", "lines": ["Stalkear cliente importante é estratégia, não obsessão.", "Ativa o sininho de notificação no perfil do cliente quente", "Quando ele postar story, entra. Comenta elogio sincero. Curte foto", "Conexão antes da venda. Quando ele entrar na call, já tem intimidade", "O cliente percebe que você respeita ele. Aí ele respeita você"]}, {"t": "h2", "x": "08 · Interação vence prompt"}, {"t": "raw", "title": "Interação vence prompt", "lines": ["A primeira resposta da IA é sempre rasa.", "A IA é um iceberg. A primeira camada é só a ponta", "Existe um mito de que pra extrair coisa boa da IA precisa de prompt perfeito. Não é verdade", "Você precisa fazer camadas. Conduzir. Pedir de novo, refinar, encurtar, mudar o tom", "Não precisa de prompt mágico. Precisa de paciência"]}, {"t": "h2", "x": "09 · Leitura de Persona"}, {"t": "raw", "title": "Leitura de Persona", "lines": ["Print do Instagram. Perfil comportamental + objeções + abordagem.", "Tira print do perfil do cliente (foto + bio + posts)", "Joga no robô Leitura de Persona", "Recebe: perfil DISC, objeções prováveis, abordagem ideal, frase inicial", "Mesma lógica pra analisar seu próprio perfil. Descobre o que tá transmitindo, ajusta bio e posts"]}, {"t": "msg", "title": "Robô · Leitura de Persona (cliente)", "when": "", "x": "Sou consultor de consórcio. Analise o perfil deste cliente a partir do print anexado. Me diga: perfil comportamental, objeções prováveis, melhor abordagem e frase inicial de impacto."}, {"t": "msg", "title": "Auto-análise de perfil", "when": "", "x": "Analise meu perfil no Instagram (print anexado). Diga: que mensagem ele transmite, qual o posicionamento atual e o que eu posso melhorar pra atrair cliente de consórcio.\nCaso real · Wesley\n\"Levei chibatada do chat. E fechei a venda.\"\n\"Cliente começou a perguntar tanto que me irritei. Falei pro chat 'vou mandar essa mulher embora'. Ele me corrigiu: ela tem perfil perfeccionista, é assim com todo mundo, não tem nada a ver com você, se controla. Foi só mandar print e copiar a resposta. Não precisei nem confessar que tinha vendido antes do prazo. Fechou tudo.\""}, {"t": "h2", "x": "10 · SPIN e Treinador de Objeções"}, {"t": "raw", "title": "SPIN e Treinador de Objeções", "lines": ["Treina antes da call. Não na call.", "SPIN: bate print da conversa do WhatsApp. Pergunta: \"em que etapa estou? Próximas perguntas?\"", "Treinador de objeções: o robô faz papel de cliente difícil. Joga as objeções clássicas. Você responde. Ele corrige", "Imersão antes da reunião real. Você não improvisa, executa"]}, {"t": "msg", "title": "Robô · SPIN Selling", "when": "", "x": "Vou abordar um [médico / advogado / empresário] pra vender consórcio. Quais perguntas SPIN eu devo fazer pra aumentar o nível de consciência dele e conduzir pra próxima etapa?"}, {"t": "msg", "title": "Robô · SPIN com print de conversa", "when": "", "x": "Anexei o print da minha conversa com o cliente. Me diz: em que etapa estou, próximas perguntas SPIN que preciso fazer e como conduzir pra fechar."}, {"t": "msg", "title": "Robô · Treinador de Objeções", "when": "", "x": "Você é um cliente difícil de consórcio. Me jogue as 10 maiores objeções desse nicho. Eu respondo. Você avalia minha resposta e me dá o melhor jeito de contornar. Vai uma por vez."}, {"t": "h2", "x": "11 · A galeria · robôs prontos"}, {"t": "raw", "title": "A galeria · robôs prontos", "lines": ["Tudo já treinado no método. Você só usa.", "Follow-up Brasileiro", "Jeitinho criativo de reaquecer cliente sumido", "Leitura de Persona", "Perfil comportamental por print do Instagram", "SPIN Selling", "Perguntas estratégicas pra qualquer reunião", "Treinador de Objeções", "Cliente difícil em modo treino antes da call", "Copy (Ladeira)", "Texto que vende. Light copy aplicado", "Ganchos virais", "Primeiros 3 segundos de reels que prendem", "Red Line", "Textinhos rápidos pra stories", "LinkedIn", "Post otimizado pra rede profissional", "Legenda", "Escrita pra rankear no Google e no ChatGPT", "Bio Instagram", "Posicionamento em 150 caracteres", "Anúncio", "Roteiro AIDA / Premissa pronto", "Carrossel", "Estrutura de slides com hierarquia", "Criador de Reels", "Roteiro de reel completo", "Imagem", "Geração de visuais pra rede social", "Criador de Meme", "Cartaz personalizado pra reaquecer cliente", "Pós-venda", "Mensagem mensal personalizada por perfil", "Acessar a galeria de robôs"]}, {"t": "h2", "x": "12 · Crie seu próprio robô"}, {"t": "raw", "title": "Crie seu próprio robô", "lines": ["Você não precisa ser engenheiro. A IA cria a IA.", "Precisa do plano pago do ChatGPT. O Plus de R$ 39 já cria (testado ao vivo na turma)", "Em Configurações > Explorar GPTs > Criar. Conversa em português normal com o builder", "\"Quero um robô que faça X. Sou consultor de consórcio. Vou te mandar um template de exemplo\"", "Cola o template. Salva. Compartilha por link. Robô teu, eterno", "Sem plano pago? Salva o template direto na memória do chat — quebra o galho pra coisa simples"]}, {"t": "msg", "title": "Prompt · Criação de robô", "when": "", "x": "Quero criar um robô que me ajude a fazer [função]. Sou consultor de consórcio. Preciso que ele [descreva o comportamento]. Vou te mandar um template de exemplo pra você adaptar e melhorar conforme o perfil do cliente."}, {"t": "raw", "title": "Crie seu próprio robô", "lines": ["[colar template]"]}, {"t": "msg", "title": "Salvar template na memória do chat", "when": "", "x": "Salva esse template na tua memória. Toda vez que eu pedir mensagem de [pós-venda / follow-up / abordagem], me traz esse modelo personalizado."}, {"t": "raw", "title": "Crie seu próprio robô", "lines": ["[colar template]"]}, {"t": "h2", "x": "13 · Atenção"}, {"t": "raw", "title": "Atenção", "lines": ["Robô não é mágica. É treinamento.", "Robô erra também. Pede de novo até ficar bom", "Conversa com robô ≠ conversa com chat normal. Confere qual aba antes de mandar", "Personaliza sempre antes de enviar pro cliente", "Se você não tem tempo de personalizar a mensagem, o cliente não tem tempo de responder você.", "Lição de casa", "Acessar a galeria de robôs e fixar 3 no teu ChatGPT", "Mandar áudio mudo + mensagem doida pra 1 cliente quente", "Rodar 1 Leitura de Persona com print de cliente real", "Mandar meme do Procura-se pra cliente conhecido", "Ativar sininho de notificação no Instagram de 5 clientes quentes", "Criar seu primeiro robô (se você tem ChatGPT Plus)", "Postar story do exercício e marcar @juliankinol", "\"Você tá operando com 2%.", "Os outros 98% são o follow-up que ninguém faz.\""]}]}, {"id": "m03", "title": "Aula 03 · 5 Ferramentas que Aceleram", "stage": [], "lead": "\"Não é sobre tecnologia. É sobre nós acelerarmos vendas. Quem não usa essas ferramentas, em algum momento vai bater a cabeça quando quiser escalar.\"", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["5 Ferramentas que Aceleram", "131 min", "A stack que faz consultor virar máquina.", "\"Não é sobre tecnologia. É sobre nós acelerarmos vendas. Quem não usa essas ferramentas, em algum momento vai bater a cabeça quando quiser escalar.\""]}, {"t": "h2", "x": "01 · A stack do consultor"}, {"t": "raw", "title": "A stack do consultor", "lines": ["6 ferramentas. Cada uma resolve uma dor.", "Tactiq", "Transcrição", "Tactiq", "Gemini", "Imagem", "Gemini", "Grok", "Notícia", "Grok", "mLabs", "Agendamento", "mLabs", "Manus", "Apresentação", "Manus", "Linktree", "Link na bio", "Linktree"]}, {"t": "h2", "x": "02 · Tactiq · transcrição que treina vendedor"}, {"t": "raw", "title": "Tactiq · transcrição que treina vendedor", "lines": ["Tactiq", "Tactiq", "Transcrição silenciosa de calls", "Toda call vira material de treinamento.", "Transcreve sem aparecer na chamada. Cliente não vê, não se incomoda", "Pega o pit todo, joga pro ChatGPT — onde você errou, onde você acertou, qual objeção travou", "Líder de equipe usa pra auditar SDR e closer — segue o método, não improvisa", "Funciona em Meet, Zoom, Teams — extensão do Chrome, instala em 1 clique", "Vira slides, checklist, resumo pro cliente — em segundos", "Abrir Tactiq →"]}, {"t": "h2", "x": "03 · Gemini · imagem com seu rosto"}, {"t": "raw", "title": "Gemini · imagem com seu rosto", "lines": ["Gemini", "Gemini", "IA de imagem com consistência", "Pega criativo que vende. Coloca o seu rosto.", "É o único que mantém os traços do seu rosto entre uma foto e outra", "O Google tem o maior banco de imagens do mundo — ninguém bate", "Não use ChatGPT pra imagem. Ele não tem consistência. Vai te dar dor de cabeça", "Pega o criativo do aluno que está bombando, troca o rosto pelo seu — modelagem que funciona", "Se errar, abra uma conversa nova. Não fica brigando com a mesma. Recomeça do zero.", "Abrir Gemini →"]}, {"t": "h2", "x": "04 · Grok · notícia em tempo real"}, {"t": "raw", "title": "Grok · notícia em tempo real", "lines": ["Grok", "Grok", "Pesquisa quente do X em tempo real", "Tudo que acontece agora chega aqui primeiro.", "Treinada no X (Twitter) — notícia, IPCA, Selic, mercado aparece aqui antes de qualquer lugar", "Pede pra ela \"pesquisa o crescimento do consórcio em 2026\" — sai com fonte oficial da ABAC", "Pede pra ela criar um post a partir da notícia — entrega já com gancho e CTA", "Funciona melhor que o ChatGPT pra conversar e interagir sobre notícia", "Abrir Grok →"]}, {"t": "h2", "x": "05 · mLabs · 1 dia/mês cria o mês todo"}, {"t": "raw", "title": "mLabs · 1 dia/mês cria o mês todo", "lines": ["mLabs", "mLabs", "Agendamento de posts em todas as redes", "1 post. 5 redes. 1 clique.", "Sobe uma vez, publica em Instagram + LinkedIn + Tik Tok + Facebook + YouTube", "Pode editar legenda por rede (mais profissional no LinkedIn, mais direto no Tik Tok)", "Sugere os melhores horários por nicho — não chuta, escala", "1 dia no mês. Grava 4 vídeos, escala em 30. Para de criar conteúdo todo dia", "Abrir mLabs →"]}, {"t": "h2", "x": "06 · Manus · apresentação que fecha"}, {"t": "raw", "title": "Manus · apresentação que fecha", "lines": ["Manus", "Manus", "Agente virtual de execução", "Chat pensa. Manus executa.", "Lê o site da sua administradora, pega a logo, a paleta, e monta apresentação com a identidade da marca", "Você troca \"Oi João\" por \"Oi Antônio\" em 2 segundos — apresentação personalizada por cliente", "Analisa planilha complexa, faz pesquisa profunda, cria site, ebook, relatório — tudo o chat fica devendo", "Estratégia: peça primeiro só a estrutura. Valide. Depois gera a apresentação pronta — não queima crédito à toa", "Foi comprada pela Meta. Vai bombar. Quem entra agora pega antes do mercado todo descobrir.", "Abrir Manus · +1.500 créditos bônus →"]}, {"t": "h2", "x": "07 · Linktree · o hub do consultor"}, {"t": "raw", "title": "Linktree · o hub do consultor", "lines": ["Linktree", "Linktree", "Link único na bio que centraliza tudo", "Onde o cliente entrar, ele te encontra inteiro.", "Um único link que abre WhatsApp, Instagram, LinkedIn, Tik Tok, site — em uma tela só", "Cliente bate o olho, decide em 3 segundos quem é você — sem ter que procurar", "Plano gratuito resolve. Não precisa pagar pra começar", "Quem viu no Tik Tok vai pro Instagram. Quem viu no LinkedIn vai pro WhatsApp. Tudo conecta", "01", "WhatsApp", "02", "Instagram", "03", "LinkedIn", "04", "Tik Tok", "05", "Facebook", "06", "Site da empresa", "Ordem importa. WhatsApp sempre em primeiro — facilita a vida do cliente. Depois redes sociais pra validação. Site da empresa por último, pra fechar a autoridade.", "Abrir Linktree →"]}, {"t": "h2", "x": "08 · O desafio dos próximos 30 dias"}, {"t": "raw", "title": "O desafio dos próximos 30 dias", "lines": ["Instala a stack. Usa toda semana.", "Hoje: instala Tactiq na próxima call, cria Linktree, cadastra Manus com o link bônus", "Toda semana: analisa 1 call no Tactiq pra ver onde melhorar o pit", "Toda semana: pega 1 notícia no Grok, monta cadência no Stories", "1 vez no mês: grava 4 vídeos, agenda os 30 dias no mLabs", "Por cliente importante: Manus monta apresentação com a identidade da administradora — você só troca o nome", "Em 30 dias o teu processo de venda não depende mais de você lembrar de fazer. A stack trabalha enquanto você fecha venda.", "Não é sobre tecnologia.", "É sobre o que você libera de tempo pra vender."]}]}, {"id": "m04", "title": "Aula 04 · Claude", "stage": [], "lead": "\"Opa, tudo bem? Passando para compartilhar uma oportunidade com você que acho que pode fazer sentido.", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["IA · Segundo Cérebro", "Claude", "Não é um chat. É a I.A. da Anthropic que entende, decide e executa por você. O segundo cérebro que ganhou duas mãos."]}, {"t": "h2", "x": "01 · ChatGPT vs Claude"}, {"t": "raw", "title": "ChatGPT vs Claude", "lines": ["ChatGPT", "Também é um segundo cérebro. Você pergunta, ele responde. Executar continua com você.", "Claude", "O segundo cérebro que executa. Entende, decide e faz o trabalho. Você delega, ele entrega.", "Mesmo cérebro, a diferença é o braço. O ChatGPT pensa com você. O Claude pensa e faz por você. Seu segundo cérebro ganhou mãos."]}, {"t": "h2", "x": "02 · Onde o Claude vive"}, {"t": "raw", "title": "Onde o Claude vive", "lines": ["Claude.ai (web)", "No navegador. Acesso rápido de qualquer computador.", "Abrir o Claude ↗", "Claude Desktop App (Cowork)", "Você baixa no próprio site da Claude. É o app que libera o Cowork pra trabalhar junto com os seus arquivos. O recomendado pro dia a dia.", "Baixar o app ↗", "Code (terminal)", "Pelo terminal. Mais pra programação e criar aplicativos. Exige conhecimento técnico. A gente não usa."]}, {"t": "h2", "x": "03 · Tour da ferramenta (eu mostro ao vivo)"}, {"t": "raw", "title": "Tour da ferramenta (eu mostro ao vivo)", "lines": ["Onde fica cada coisa na tela do Claude. Vou abrir e mostrar cada uma:", "Novo chat", "Projetos", "Customizar chat", "Fixar chat", "Cowork", "Artefatos (Claude Design)", "Dentro de Configurações", "Idioma", "Uso e cobrança", "Conectores", "Cowork", "Instruções pro Claude (a personalização)", "Aparência"]}, {"t": "h2", "x": "04 · Os 3 modos"}, {"t": "raw", "title": "Os 3 modos", "lines": ["Modo é onde você trabalha:", "Chat", "Uso normal. Conversa, pergunta, brainstorm, como falar com um colega. Tem modo voz e captura de tela. Exemplo: \"me explica o que é ROI\".", "Cowork", "Conecta no seu computador e acessa as suas pastas e documentos. Ele organiza pastas, abre planilhas, cria documentos e acha um arquivo no meio de centenas. Exemplo de consultor: \"abastece minha planilha financeira toda vez\", você conecta o Cowork com uma pasta e ele faz. Pensa na pasta como um quarto: tudo que tá lá dentro, ele enxerga e usa.", "Code", "Programação e uso avançado da inteligência artificial: criar aplicativos, agentes, dashboards. A gente não usa no dia a dia.", "Regra simples: Chat pra uso normal. Cowork pra conectar com o seu computador."]}, {"t": "h2", "x": "05 · Os 3 modelos do Claude"}, {"t": "raw", "title": "Os 3 modelos do Claude", "lines": ["Modelo é o motor que pensa:", "Haiku 4.5", "O mais rápido e barato. A gente não usa.", "Sonnet 4.6", "O equilíbrio. É o que a gente usa no dia a dia.", "Opus 4.8 ou superior", "O mais inteligente, pra tarefa pesada. No Free ou Pro consome muito crédito. Na maioria das vezes o Sonnet resolve.", "Na dúvida, sempre use o Sonnet 4.6. Guarda isso."]}, {"t": "h2", "x": "06 · Planos"}, {"t": "raw", "title": "Planos", "lines": ["Escolhe pelo seu momento:", "Free", "Grátis", "Pra testar e sentir o poder do Claude.", "Esse é o seu momento", "Pro", "~R$110/mês", "Dia a dia. Apresentações, insights, segundo cérebro. Seu sócio comercial.", "Max", "a partir de ~R$540/mês", "Quando você crescer e quiser rodar pesado."]}, {"t": "h2", "x": "07 · Memória"}, {"t": "raw", "title": "Memória", "lines": ["O Claude vai te conhecendo e acelerando. Dentro de cada projeto ele cria uma memória: o que deu certo, ele guarda e repete o padrão. Você pode deixar regra fixa salva, tipo: \"toda vez que gerar um relatório, usa a identidade visual da Julian Kinol\". A memória do projeto aparece nas configurações dele e você pode editar quando quiser."]}, {"t": "h2", "x": "08 · Conectores (liga o Claude nas suas ferramentas)"}, {"t": "raw", "title": "Conectores (liga o Claude nas suas ferramentas)", "lines": ["Liga o Claude nas suas ferramentas. Os que mais fazem sentido pro consultor de consórcio, com um exemplo de cada:", "Canva", "Cria post e carrossel direto do Claude.", "Gmail", "Lê e responde e-mail de cliente.", "Google Drive", "Abre suas planilhas de vendas e contatos.", "Miro", "Mapa de funil e jornada do cliente.", "G", "Google Calendar", "Agenda follow-up e fechamento.", "N", "Notion", "Organiza base de contatos e anotações.", "CF", "Cloudflare", "Publica landing page ou site no ar. Dá no gratuito."]}, {"t": "h2", "x": "09 · Projetos: o coração"}, {"t": "raw", "title": "Projetos: o coração", "lines": ["Projeto é onde você junta arquivos e contexto num lugar só. O que você põe lá dentro, o Claude enxerga e usa.", "Pensa num quarto. O projeto é esse quarto. Tudo que você coloca lá dentro, o Claude tem acesso. Joga a logo, o material, os dados da sua consultoria, e ele trabalha com aquilo."]}, {"t": "h2", "x": "10 · Modelagem"}, {"t": "raw", "title": "Modelagem", "lines": ["Roube como artista", "Não existe nada no mercado que você não consiga refazer. Viu uma apresentação que todo mundo amou? Um vídeo que viralizou? Um carrossel campeão? Joga pro Claude e fala: \"quero uma igual, só que melhor e com a minha cara\". Ele modela. A barreira entre você e qualquer criador acabou."]}, {"t": "h2", "x": "11 · Na prática"}, {"t": "raw", "title": "Na prática", "lines": ["Atenção: o \"robô\" é o projeto. Você cria o projeto, cola o comando (system prompt) nas instruções e joga os arquivos dentro (logo, modelos, exemplos). Faz isso uma vez e ele gera o resultado sempre.", "1. Apresentações personalizadas (HTML)", "Cria um projeto, joga a logo e os arquivos da empresa, e gera uma apresentação personalizada pro cliente. Começando do zero, é só pedir com um prompt assim:", "Prompt", "Você é meu criador de apresentações de consórcio. Sou consultor e estou começando do zero.", "Cria uma apresentação personalizada pra eu mostrar a um cliente: capa, o que é consórcio, comparação com financiamento e a oferta.", "Linguagem simples e visual. Gera em HTML pra eu abrir e apresentar.", "Acessar o Drive ↗", "2. Carrossel", "Cria um projeto de carrossel, joga os arquivos dentro, e gera o carrossel pronto pra postar (baixa em PNG em alta resolução).", "Acessar o Drive ↗", "3. Calculadora de consórcio", "Pede pro Claude criar uma calculadora que compara financiamento com consórcio, lance e contemplação. Ele gera em HTML, você bota sua logo e sua cor. O cliente acha que você tem um império por trás.", "Ver a calculadora ↗", "4. Planilhas", "Não tem planilha que o Claude não monte: controle financeiro, projeção, gráfico, melhor que na mão. Pede pro plano normal mesmo, ele dá conta. É só pedir com um prompt assim:", "Prompt", "Monta uma planilha de controle de vendas pra mim.", "Colunas: cliente, valor da carta, parcela, status do follow-up e data de fechamento.", "Coloca no topo um resumo com o total vendido no mês."]}, {"t": "h2", "x": "12 · Skills (habilidades)"}, {"t": "raw", "title": "Skills (habilidades)", "lines": ["Skill é um treinamento. Você ensina o Claude a fazer uma tarefa do seu jeito uma vez, e ele repete sempre igual. É o Claude aprendendo a trabalhar do jeito do consultor.", "Pensa num processo comercial: passo 1 abastece a planilha, passo 2 acha os inadimplentes, passo 3 gera o relatório, passo 4 manda no e-mail. Em vez de refazer todo mês, você salva como skill. Na próxima vez é só falar \"ativa o processo comercial\" e ele executa sozinho.", "Liberei a pasta com as skills que a gente está montando. A primeira a gente faz junto, como exercício ao vivo.", "Acessar as skills ↗"]}, {"t": "h2", "x": "13 · Como criar uma skill"}, {"t": "raw", "title": "Como criar uma skill", "lines": ["1. Você faz a tarefa uma vez com o Claude, passo a passo.", "2. Depois fala: \"salva isso como uma skill chamada X\".", "3. Pronto. Na próxima vez é só ativar e ele executa igual.", "O próprio Claude cria a skill pra você. Você nem precisa saber a parte técnica."]}, {"t": "h2", "x": "14 · Travou? Pergunta pro Claude"}, {"t": "raw", "title": "Travou? Pergunta pro Claude", "lines": ["Travou? Pergunta pro Claude. Dúvida de como fazer, não sabe o que tem dentro de um projeto, dúvida técnica: pergunta pro Claude. Ele te responde e te ensina o caminho, ninguém precisa decorar nada. \"Não sei fazer isso\" vira \"Claude, como faço?\". É o que eu falo o dia inteiro: faz, dá teu jeito, resolve."]}, {"t": "h2", "x": "15 · Claude no Chrome (a extensão)"}, {"t": "raw", "title": "Claude no Chrome (a extensão)", "lines": ["É o Claude dentro do seu navegador. Ele enxerga a página que você está vendo e age por você: navega, pesquisa, conecta e responde. Dá pra automatizar prospecção sem sair do site.", "Como instalar", "1. Entra em claude.ai/chrome (precisa de plano pago do Claude).", "2. Clica em adicionar a extensão ao Chrome.", "3. Faz login com a sua conta do Claude.", "4. Abre o site onde quer usar (LinkedIn, WhatsApp Web…) e ativa o Claude na barra do navegador.", "Instalar a extensão ↗", "Dois exemplos prontos pra copiar e colar:", "Prompt — LinkedIn", "Você é meu assistente de prospecção no LinkedIn. Sou consultor de consórcio prospectando médicos em Curitiba.", "Sua tarefa: analisar perfis de médicos e enviar pedido de conexão para quem parecer um bom potencial cliente para consórcio de imóvel ou equipamento.", "Use o bom senso para avaliar cada perfil. Se parecer médico estabelecido ou em crescimento, conecta. Se parecer muito iniciante ou perfil vazio, pula.", "Envie pedido de conexão sem mensagem, aguarde 10 segundos entre cada um e pare em 10 conexões.", "Prompt — WhatsApp Web", "Você é meu assistente de prospecção no WhatsApp Web. Sou consultor de consórcio de veículos.", "Sua tarefa: enviar mensagem apenas para os contatos com a tag \"teste 10\" no WhatsApp Business.", "Envie essa mensagem exata:", "\"Opa, tudo bem? Passando para compartilhar uma oportunidade com você que acho que pode fazer sentido.", "Estou trabalhando com consórcio de veículos e temos cartas disponíveis agora:", "👉 R$ 55 mil por R$ 319/mês", "👉 R$ 100 mil por R$ 580/mês", "👉 R$ 130 mil por R$ 628/mês", "Sem juros, sem entrada, sem complicação.", "Se tiver pensando em trocar de carro ou financiar um veículo, vale a pena a gente conversar antes de você fechar com banco.", "Tem interesse?\"", "Aguarde 10 segundos entre cada mensagem e pare ao finalizar todos os contatos da tag."]}]}, {"id": "m05", "title": "Aula 05 · Posicionamento: Instagram como funil", "stage": [], "lead": "\"O cliente tem 3 segundos pra decidir se segue você ou pula. 10 segundos pra converter. Não pode ter ruído no caminho.\"", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["144 min", "Posicionamento · Instagram como funil", "\"O cliente tem 3 segundos pra decidir se segue você ou pula. 10 segundos pra converter. Não pode ter ruído no caminho.\""]}, {"t": "h2", "x": "01 · Abertura"}, {"t": "raw", "title": "Abertura", "lines": ["Marketing digital é ocupar espaço na cabeça do cliente.", "Não é postar consórcio. É existir lá dentro antes da decisão", "Quando ele decidir fechar, vai lembrar de você primeiro", "Tira print dessa aula e marca @juliankinol no story. Eu reposto"]}, {"t": "h2", "x": "02 · O grande tabu"}, {"t": "raw", "title": "O grande tabu", "lines": ["Pessoas se conectam com pessoas. Não com lojas.", "Se o teu perfil parece loja, o cliente entende que você quer vender. Ninguém entra no Instagram pra ser vendido", "Tem que ter seu rosto. Sua família. Seu humano", "Ninguém segue a Havan. Todo mundo segue o velho da Havan", "Ninguém segue a Love. Todo mundo segue o Pablo Marçal", "Ninguém segue a Geração de Valor. Todo mundo segue o Flávio Augusto", "Logo não vende. Pessoa vende"]}, {"t": "h2", "x": "03 · Tira da cabeça"}, {"t": "raw", "title": "Tira da cabeça", "lines": ["Quanto mais natural, mais converte. Quanto mais bonitinho, mais parece que você quer vender.", "Não posso postar família", "Posta. Família gera autoridade — mostra que você não é golpista", "Preciso postar todo dia", "Não. 3 vezes por semana já é ótimo", "Preciso de conteúdo bonito", "Conteúdo bonito parece anúncio. Lo-fi viraliza", "Preciso de muitos seguidores", "Você precisa de compradores, não de seguidores", "Preciso de câmera profissional", "Qualquer celular grava. Boa luz resolve", "Não posso falar de preço", "Pode. Mostra valor, mostra tabela"]}, {"t": "h2", "x": "04 · Consumidor ou produtor?"}, {"t": "raw", "title": "Consumidor ou produtor?", "lines": ["O algoritmo é programado pra te fazer perder tempo.", "Se você não fizer nada, mais de 50% do teu feed é de gente que você não segue", "Hora no Instagram pra um vendedor é hora de produzir, não consumir", "O cliente que você precisa fazer follow-up posta uma foto. Nem a família dele curte. Você precisa estar lá", "Você vai parar de seguir criador de conteúdo. Só cliente"]}, {"t": "h2", "x": "05 · A virada · \"Não seguidores\""}, {"t": "raw", "title": "A virada · \"Não seguidores\"", "lines": ["Deixa de seguir quem não te segue. Vê o feed mudar.", "Extensão do Chrome lista todo mundo que você segue e não te segue de volta", "Versão grátis: 5 unfollows por minuto (pra não tomar bloqueio do Instagram)", "Versão paga R$ 70/ano: 150 + 150 por dia, faz manhã e noite", "Hack: clica em \"abrir em nova aba\" várias vezes. Aí passa pela lista deixando de seguir um por um sem travar", "Wesley deixou de seguir 1.300 pessoas. Hoje só aparece cliente no feed dele", "Buscar \"não seguidores extensão\" na Chrome Web Store"]}, {"t": "h2", "x": "06 · O funil em 4 pilares"}, {"t": "raw", "title": "O funil em 4 pilares", "lines": ["Atrair. Educar. Mostrar prova. Chamar pra ação.", "01", "Atrair", "Fala da dor ou do desejo do cliente", "02", "Educar", "Aumenta o nível de consciência. Diz como", "03", "Prova social", "Mostra que funciona com outros clientes", "04", "Chamada", "Diz pra clicar, comentar, mandar DM", "Esses 4 pilares vão se repetir em cada parte do Instagram: bio, posts fixados, stories, destaques, DM", "O Instagram inteiro vira um funil quando você empilha esses pilares em cada ponta"]}, {"t": "h2", "x": "07 · Funil 1 · Bio em 3 linhas"}, {"t": "raw", "title": "Funil 1 · Bio em 3 linhas", "lines": ["3 linhas. 3 segundos. O cliente decide.", "Linha 1 · Promessa", "Te ajudo a construir imóveis sem juros", "Linha 2 · Autoridade", "+37 milhões em vendas · forma vendedores e líderes", "Linha 3 · Chamada", "Fale comigo no link abaixo ↓", "Não é sobre você. É sobre a transformação do cliente", "Se você tem 4 linhas, a última some no celular. Mantém 3", "Empresta autoridade quando precisar: representa Rodobens / +20 anos de mercado / etc.", "Link único (Linktree) com WhatsApp em primeiro lugar. Sem 2 links soltos na bio"]}, {"t": "msg", "title": "Robô · Criador de Bios", "when": "", "x": "Me ajude a construir uma Bio."}, {"t": "raw", "title": "Funil 1 · Bio em 3 linhas", "lines": ["Quando ele perguntar, responda:", "- Nicho: consultor de consórcio especialista em [investimento / imobiliário]", "- Transformação que eu entrego: [descrever]", "- Autoridade: [resultados, números, empresa]"]}, {"t": "msg", "title": "Link WhatsApp com mensagem automática", "when": "", "x": "Gere um link do WhatsApp pro número [55XXXXXXXXXXX] com a mensagem pré-preenchida: \"Oi [Nome], vi seu perfil no Instagram e quero saber mais sobre consórcio.\""}, {"t": "h2", "x": "08 · Funil 2 · 3 posts fixados"}, {"t": "raw", "title": "Funil 2 · 3 posts fixados", "lines": ["Quem é você. Prova do teu trabalho. Tua família.", "Post 01 · esquerda", "Quem sou eu", "Foto ou carrossel + legenda com clareza total do que você transforma. Esse post o algoritmo lê.", "Post 02 · centro", "Autoridade", "Prova social: foto com cliente contemplando, equipe, troféu, post que viralizou.", "Post 03 · direita", "Família", "Esposa, filho, beijo no filho. Humanização que diz \"não é golpe, é gente de verdade\".", "Cliente entra, lê os 3 em sequência: \"é ele\" → \"ele entrega\" → \"é confiável\"", "Não tem família? Coloca foto com amigo, pet, time de trabalho", "Template \"Quem sou eu\" no Canva: troca a foto e a legenda, sobe", "Abrir template no Canva", "Caso real · Marconi", "\"O post viralizou. Mas atraiu o público errado.\"", "\"O Marconi impulsionou um post bem feito. Resultado: começou a aparecer um monte de homem abordando ele no Direct pra outras coisas que não era consórcio. Por quê? Porque o perfil não tinha posicionamento. Não tinha família, não tinha autoridade clara. Depois que ele fixou os 3 posts certos, o problema resolveu. Posicionamento corrige o que o anúncio sozinho não corrige.\""]}, {"t": "h2", "x": "09 · Funil 3 · @ (handle)"}, {"t": "raw", "title": "Funil 3 · @ (handle)", "lines": ["O cliente nunca vai colocar ponto ou underline na busca.", "Erra", "@wesley_brasil1", "@thiago.schneider_", "@marconi.consorcio", "Acerta", "@wesleybrasil", "@thiagoschneider", "@marconiconsorcio", "Começa com seu nome. Sem ponto, sem underline antes do nome", "Se já tem outra pessoa com o nome igual, coloca a palavra do nicho (Marconi consórcio)", "Não coloca nome de administradora no @. Posicionamento é único — você não vai morrer na ADEMICON / Rodobens / etc.", "Use de apelido vale quando o cliente te conhece pelo apelido. Pensa: \"como ele vai me buscar?\""]}, {"t": "h2", "x": "10 · Funil 4 · Nome"}, {"t": "raw", "title": "Funil 4 · Nome", "lines": ["O campo Nome é o que cai na busca.", "Diferente do @, o campo Nome é indexado pelo algoritmo do Instagram", "Coloca: seu nome + especialidade + cidade · ex: \"João Silva · Consórcio · Curitiba\"", "Quando o cliente pesquisar \"consórcio Curitiba\" no Instagram, você aparece", "Mesma lógica vale pro Google e pro ChatGPT, que indexam seu perfil"]}, {"t": "h2", "x": "11 · Atenção"}, {"t": "raw", "title": "Atenção", "lines": ["Posicionamento é único. Você é a autoridade. Não delega pra empresa.", "Se você muda de administradora amanhã, perdeu o trabalho construído", "Posicione seu nome, não a empresa", "Empresta a autoridade da empresa quando precisar, mas o protagonista é você", "O cliente tem 3 segundos pra decidir se segue ou sai. Tira ruído. Traz clareza total.", "Lição de casa", "Instalar extensão \"não seguidores\" no Chrome e começar a deixar de seguir", "Refazer a Bio em 3 linhas usando o Robô Criador de Bios", "Fixar 3 posts: Quem sou eu, Autoridade, Família", "Ajustar o @ (tirar ponto e underline antes do nome)", "Ajustar o nome em negrito do perfil (nome + especialidade + cidade)", "Montar o Linktree com WhatsApp em primeiro lugar", "Postar story do exercício e marcar @juliankinol", "\"Cliente bate o olho. 3 segundos.", "Se parece loja, ele pula. Se parece pessoa, ele para.\""]}]}, {"id": "m06", "title": "Aula 06 · Acelerador de Conteúdo", "stage": [], "lead": "\"Conteúdo é o que aumenta o nível de consciência do líder. Quando ele te enxerga como autoridade, tudo muda. Todo mundo quer comprar de uma autoridade. E todo mundo respeita uma autoridade.\"", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["Acelerador de Conteúdo", "164 min", "Sem conteúdo, seu perfil é uma vitrine fechada.", "\"Conteúdo é o que aumenta o nível de consciência do líder. Quando ele te enxerga como autoridade, tudo muda. Todo mundo quer comprar de uma autoridade. E todo mundo respeita uma autoridade.\""]}, {"t": "h2", "x": "01 · A regra de ouro do criador"}, {"t": "raw", "title": "A regra de ouro do criador", "lines": ["Dane-se. Ninguém paga as minhas contas.", "82% das pessoas tem medo de falar em público. É o maior medo do ser humano — maior que o medo da morte", "Vai aparecer um sabotador na tua cabeça: \"não tá bom, não posta\". Ignora", "Primeiro você começa. Depois você melhora. Ninguém começou bom — ninguém", "Se você não se posiciona, seu concorrente vai aparecer no seu lugar", "Se você não posta, alguém posta por você — e fecha a venda que era sua. O primeiro vídeo é ruim. Posta mesmo assim."]}, {"t": "h2", "x": "02 · O jogo do algoritmo"}, {"t": "raw", "title": "O jogo do algoritmo", "lines": ["Instagram é uma empresa de atenção.", "O objetivo do app é manter as pessoas o maior tempo possível dentro dele", "Distribui o que retém atenção. Se a pessoa para e assiste, ele entrega pra mais gente. Se passa direto, ele esconde", "Vale pra TODOS os formatos — Stories, Reels, Carrossel, Lives", "Anúncio que tira a pessoa pra outra plataforma custa mais caro. Anúncio que manda comentar no Direct fica barato"]}, {"t": "h2", "x": "03 · O ranking das interações"}, {"t": "raw", "title": "O ranking das interações", "lines": ["Curtida vale quase nada.", "1", "Compartilhamento", "Mais forte", "2", "Salvar", "Forte", "3", "Comentário", "Médio", "4", "Curtida", "Quase zero", "Compartilhamento: a pessoa traz outra pessoa pra dentro do Instagram → ouro", "Salvar: ela investiu tempo e quer ver de novo → o algoritmo conta dobrado", "Comentário: ela parou pra escrever — bom, mas menos que compartilhar", "Curtir: 1 segundo de gasto. Quase não pesa"]}, {"t": "h2", "x": "04 · Atrai + Educa = Vende"}, {"t": "raw", "title": "Atrai + Educa = Vende", "lines": ["Atrai. Educa. Vende.", "Só pessoal", "Foto com filho", "Viagem", "Restaurante", "Bastidor", "Você não vende", "Equilibra os pratos", "Atrai com pessoal", "Educa com autoridade", "Mostra prova", "Faz chamada", "Você vende", "Conteúdo pessoal atrai: qualquer post que não educa — viagem, café, família, bastidor", "Conteúdo educativo posiciona: sem ele, a pessoa não te vê como autoridade", "Só educativo = engajamento despenca. Ninguém entra no Instagram pra comprar", "Só pessoal = nunca vende. Equilibra os pratos"]}, {"t": "h2", "x": "05 · As 5 partes de todo conteúdo"}, {"t": "raw", "title": "As 5 partes de todo conteúdo", "lines": ["3 segundos decidem se a pessoa assiste ou pula.", "01", "Gancho", "3 primeiros segundos. Pára a pessoa", "02", "Desenvolvimento", "Entrega a ideia. Educa", "03", "Chamada", "\"Comenta consórcio no Direct\"", "04", "Red Line", "Texto na tela · 5 segundos", "05", "Legenda longa", "A IA lê e indexa o seu vídeo", "Gancho errado · cai em 3s", "\"Oi gente, tudo bem? Hoje eu quero falar com vocês sobre…\"", "Gancho que prende", "\"Como conquistar seu carro sem pagar juros absurdos — mesmo ganhando pouco.\"", "Chamada SEMPRE no Direct. \"Comenta CONSÓRCIO no Direct que eu te explico.\" Não pede pra comentar no post — Instagram às vezes incomoda o cliente. Direct é privado, fica mais fácil."]}, {"t": "h2", "x": "06 · Os 4 robôs do criador"}, {"t": "raw", "title": "Os 4 robôs do criador", "lines": ["Você não cria do zero. O robô entrega. Você ajusta.", "Robô 01", "Ganchos que viralizam", "Você dá o tema. Ele entrega 10 ganchos para os 3 primeiros segundos.", "Robô 02", "Roteiros (Rios)", "Roteiro completo no formato que você escolher: Lo-Fi, React, Tela Dividida, Notícia.", "Robô 03", "Red Lines", "Texto curto que fica 5 segundos na tela puxando o gancho. Reforça a atenção.", "Robô 04", "Legendas SEO", "Legenda longa com fonte real puxada da internet — a IA lê, indexa no Google, no ChatGPT, no LinkedIn.", "Você nunca aceita a primeira resposta. Refaz, ajusta, refina. O robô é seu segundo cérebro. Você é o curador."]}, {"t": "h2", "x": "07 · Formato 01 · Post único · estilo Twitter"}, {"t": "raw", "title": "Formato 01 · Post único · estilo Twitter", "lines": ["Canva", "Feito no Canva", "Uma frase. Sem rosto, sem edição.", "Frase forte que se posiciona como autoridade. Direto. Compartilhável", "Estratégia: \"roubar como artista\" — pega post que tá viralizando, manda pro ChatGPT modelar pra consórcio", "Pede pro chat \"crie 10 frases sobre consórcio pra aumentar consciência do líder\" — você escolhe a melhor", "Na legenda, posiciona como autoridade + chamada no Direct (palavra X)", "Posta no máximo 2x por semana — não gera engajamento alto, mas posiciona", "Players de referência", "Flávio Augusto · Caio Carneiro · Tiago Negro", "\"Meus fracassos sempre foram meus professores. Os fracassos dos outros também.\" (Flávio Augusto)", "O Flávio tem 3 milhões e o post dá 1 mil curtidas. Não é pra viralizar — é pra ser lembrado."]}, {"t": "h2", "x": "08 · Formato 02 · Lo-Fi · só você + teleprompter"}, {"t": "raw", "title": "Formato 02 · Lo-Fi · só você + teleprompter", "lines": ["Edits", "Feito no Edits", "Só você e a câmera. Autoridade imediata.", "Câmera frontal. Sem edição. Sem produção. Você falando.", "O Edits tem um teleprompter nativo — você cola o roteiro do robô e lê. Ninguém percebe", "Não tem que ficar bonito. Tem que ser autêntico. Quanto menos polido, mais converte", "Legenda automática + corte de respiros (silêncios) — o app faz tudo", "Máximo 45 segundos. Não passa disso — gente não segura", "Players de referência", "Tiago Negro · Pablo Marçal", "\"O cliente bate o olho, ele sabe que você é uma autoridade. Não é pra ser bonito — é pra ser do jeito que você acordou. Autenticidade é o que gera conexão.\""]}, {"t": "h2", "x": "09 · Formato 03 · Preguiçoso · vídeo curto em loop"}, {"t": "raw", "title": "Formato 03 · Preguiçoso · vídeo curto em loop", "lines": ["Edits", "Feito no Edits", "Vídeo de 7 segundos. A legenda vende.", "Vídeo curto, qualquer coisa: você tomando café, andando, tela do computador", "O segredo: gancho na legenda — \"5 coisas que ninguém te conta sobre financiamento\"", "Enquanto a pessoa lê a legenda, o vídeo entra em loop — o Instagram conta como retenção máxima", "Não precisa mostrar o rosto. Pode ser café, paisagem, mão fazendo algo", "Mais viralizável de todos. Mais fácil de fazer também", "Caso · Áquila", "\"Talvez eu não saiba seguir uma receita…\"", "\"…mas eu sei multiplicar seu patrimônio com consórcio.\"", "Vídeo de 7 segundos rodando em loop enquanto a pessoa lê a legenda. O algoritmo entende que a pessoa assistiu o vídeo 4 vezes."]}, {"t": "h2", "x": "10 · Formato 04 · React · reage a quem viralizou"}, {"t": "raw", "title": "Formato 04 · React · reage a quem viralizou", "lines": ["Edits", "Feito no Edits", "Pega o vídeo que já viralizou. Dá sua opinião.", "Procura vídeo viral sobre teu nicho — financiamento, consórcio, investimento, mercado", "Não reage a qualquer vídeo — só ao que já tá com milhões de visualizações. O gancho vem pronto", "No Edits: sobreposição (vídeo dele em cima, você embaixo) — fica tipo react do YouTube", "Você entra dando sua opinião quando ele faz a pausa estratégica", "Posicionamento como autoridade imediato — você não concorda, você prova", "Caso · Consórcio é pirâmide", "\"Vou te provar que ele tá errado.\"", "\"Influencer com 1 milhão de seguidores disse que consórcio era pirâmide. A galera do consórcio fez react. Tirou print da fala dele, mostrou o cálculo real, posicionou autoridade. Vídeo viralizou porque o gancho já vinha pronto.\""]}, {"t": "h2", "x": "11 · Formato 05 · Tela dividida · notícia + você"}, {"t": "raw", "title": "Formato 05 · Tela dividida · notícia + você", "lines": ["Edits", "Feito no Edits", "Pega notícia quente. Conecta com consórcio.", "Print de notícia no topo. Você reagindo embaixo (ou ao lado)", "Funciona com IPCA, Selic, mercado, decisão do governo — qualquer pauta atual", "Pede pro Robô de Roteiros conectar a notícia com a vantagem do consórcio", "Termina com \"comenta PLANO no Direct que eu te explico\"", "É o formato que eu mais uso — porque é o que mais traz autoridade", "Exemplo prático", "\"Selic a 12,5% ao ano. Sabe o que isso faz no seu bolso?\"", "\"Print da notícia da Selic. Você embaixo: 'Quanto maior a Selic, mais caro o dinheiro. Financiamento sobe. Juros sobe. No fim quem paga é você.' Aí entra o consórcio como alternativa. 3 segundos pra prender, 30 pra educar, 1 pra chamar.\""]}, {"t": "h2", "x": "12 · Escala · 4 vídeos no sábado, mês inteiro pronto"}, {"t": "raw", "title": "Escala · 4 vídeos no sábado, mês inteiro pronto", "lines": ["1 dia. 4 vídeos. Mês inteiro de conteúdo.", "Sábado de manhã: grava 4 vídeos do mesmo formato. 1h30min, no máximo 2h", "Cada vídeo posta 1x por semana — o mês inteiro coberto", "O mLabs agenda em todas as redes (Instagram + LinkedIn + TikTok + Facebook) em 1 clique", "Você não cria conteúdo todo dia. Cria 1x por mês. O resto é venda", "Quando acerta um formato, para de inventar. Repete. O que viralizou hoje viraliza daqui 1 ano", "\"Repetir conteúdo é coisa da nossa cabeça. O cliente não viu. Mesmo que tenha 10 mil seguidores, esquece — posta de novo.\""]}, {"t": "h2", "x": "13 · Limpa quem não te segue"}, {"t": "raw", "title": "Limpa quem não te segue", "lines": ["Não seja consumidor. Seja produtor.", "Instala a extensão \"Não Seguidores\" no Chrome (só funciona no computador)", "Lista todos que você segue e não te seguem de volta", "Deixa de seguir — exceto cliente potencial que você está prospectando", "Influencer que rouba seu tempo? Deixa de seguir. Não te paga conta", "Seu feed passa a ser produção, não consumo de dopamina", "Buscar \"Não Seguidores\" na Chrome Web Store →"]}, {"t": "h2", "x": "14 · O desafio dos próximos 30 dias"}, {"t": "raw", "title": "O desafio dos próximos 30 dias", "lines": ["Cada formato. Pelo menos 1 vez.", "Semana 1: Post único estilo Twitter (Canva) + 1 Lo-Fi (Edits)", "Semana 2: 1 Preguiçoso (vídeo loop) + 1 React", "Semana 3: 1 Tela dividida (notícia) + 1 do formato que você curtiu mais", "Semana 4: Escala o formato campeão · grava 4 vídeos · agenda no mLabs", "Todo dia: ocupa espaço na cabeça do líder · marca @juliankinol no Stories que eu reposto", "Em 30 dias você descobre qual formato é o seu. A partir do mês 2, você só escala o que funcionou. Você não cria conteúdo todo dia — você produz uma vez, escala pro mês inteiro, foca no que importa: fechar venda.", "Você não vende quando posta.", "Vende quando ele te lembra antes de financiar."]}]}, {"id": "m07", "title": "Aula 07 · Funil de Vendas nos Stories", "stage": [], "lead": "\"Bio, username, posts fixados, conteúdo que atrai e educa — tudo isso é funil. Falta o que mais vende: Stories. É onde a mágica da venda acontece.\"", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["Funil de Vendas nos Stories", "149 min", "Stories é a maior arma do vendedor.", "\"Bio, username, posts fixados, conteúdo que atrai e educa — tudo isso é funil. Falta o que mais vende: Stories. É onde a mágica da venda acontece.\""]}, {"t": "h2", "x": "01 · A maior arma do vendedor"}, {"t": "raw", "title": "A maior arma do vendedor", "lines": ["Stories dura 24 horas. Stories serve pra 4 coisas.", "Prospectar — quem curtiu, quem comentou, quem reagiu tá pedindo pra ser abordado", "Aumentar o nível de consciência do líder — ele vê e te respeita", "Posicionar autoridade — mostrando rotina, prova, treinamento", "Criar funil — uma cadência boa vira destaque e trabalha 24h depois das 24h", "Imagina numa loja: você olhando uma peça, esperando o vendedor. Ele não aparece. Você fica com raiva e sai. Cliente que curte Stories tá nessa mesma posição — esperando ser abordado."]}, {"t": "h2", "x": "02 · Seja intencional em tudo"}, {"t": "raw", "title": "Seja intencional em tudo", "lines": ["O maior erro é não ser intencional.", "Tudo é motivo pra postar. Mas todo Stories tem que ter propósito", "Não posta foto do café, depois boleto, depois filho, depois tabela — Instagram lê isso como ruído", "Hoje você tá no curso? Posta uma frase pensando no seu cliente, não em você", "Tá num momento da família? Posta — mas pergunta algo que gera interação (\"gosta de café, sim ou não?\")", "Curtiu o teu post = próximo post que aparece pra ela é o teu. Aproveita"]}, {"t": "h2", "x": "03 · Falou, mostra"}, {"t": "raw", "title": "Falou, mostra", "lines": ["Mostrar é 10 vezes mais forte do que falar.", "Falou que o cliente foi contemplado? Mostra o print", "Falou da parcela? Mostra o boleto (borra o nome)", "Falou do treinamento? Mostra o grupo", "Falou da notícia do IPCA? Mostra a manchete na tela", "Não precisa só falar de resultado. Mostra. Toda vez que você fala algo forte, mostra a prova logo depois."]}, {"t": "h2", "x": "04 · Clareza visual sem ruído"}, {"t": "raw", "title": "Clareza visual sem ruído", "lines": ["Foca na mensagem. Não na foto.", "Sabotador", "Letra elegante", "Sem contraste", "Textão", "Câmera suja", "Foto no escuro", "Stories que vende", "Letra clássica", "Fundo preto, letra branca", "1 frase por tela", "Câmera limpa", "Iluminação boa", "70% é iluminação, 30% é câmera. Não precisa de iPhone 17", "Limpa a câmera do celular antes de gravar. Marca de dedo destrói o vídeo", "Use sempre a mesma foto na cadência. A ideia é a mensagem, não a foto", "Sem iluminação? Hack do fundo preto: clica em desenhar, escolhe preto, segura na tela — pinta tudo. Pronto, fundo limpo"]}, {"t": "h2", "x": "05 · A regra das janelas de 24h"}, {"t": "raw", "title": "A regra das janelas de 24h", "lines": ["Tudo na mesma janela conta como uma cadência só.", "Postou às 21h? A janela vai até às 21h do dia seguinte", "Pra o Instagram, do primeiro ao último Stories dessa janela = uma sequência", "Se a sequência é aleatória, o pessoal pula → janela ruim → próximas distribuídas pra menos gente", "Janela limpa: espera a anterior morrer antes de começar a nova", "O primeiro Stories define o tom da sequência inteira. Cuida dele", "Faz primeiro. Depois melhora. Não apaga, não fica avaliando se engajou. Solta a próxima cadência amanhã, do zero."]}, {"t": "h2", "x": "06 · A estrutura da Cadência"}, {"t": "raw", "title": "A estrutura da Cadência", "lines": ["Toda cadência tem 5 etapas. Sempre.", "01", "Gancho", "3 primeiros segundos. Chama atenção", "02", "Desenvolvimento", "Conta a história. Educa", "03", "Prova", "Print, boleto, foto, conversa", "04", "Autoridade", "Por que você. O seu diferencial", "05", "Chamada", "\"Comenta a palavra X\"", "Gancho: \"Cliente acabou de ganhar 25 mil\" — atenção", "Desenvolvimento: como aconteceu, parcela, grupo, contemplação", "Prova: print da conversa, comprovante, foto do grupo (borra o que tiver que borrar)", "Autoridade: \"É por isso que você precisa de consultor especialista\"", "Chamada: \"Comenta consórcio aqui embaixo que eu te explico\""]}, {"t": "h2", "x": "07 · A chamada que converte"}, {"t": "raw", "title": "A chamada que converte", "lines": ["Entrega o feijão com arroz. A pessoa só tem que digitar.", "Cliente trava", "\"Me chama no Direct\"", "\"Manda mensagem\"", "\"Fala comigo\"", "Cliente só digita", "\"Comenta CONSÓRCIO\"", "\"Comenta CARRO\"", "\"Comenta PLANO\"", "Se você fala \"me chama no Direct\", a pessoa para o celular e pensa \"meu deus, o que eu falo?\". Ela trava", "Quando você diz \"comenta a palavra X\", ela só digita. Passa a responsabilidade pro vendedor, alivia pro cliente", "O último Stories da cadência é SEMPRE a chamada. Sem exceção", "A chamada é tipo uma barreira que o cara desce, ele trava. Depois que você fechar 4 contemplados só por causa de chamada, você nunca mais para de fazer."]}, {"t": "h2", "x": "08 · Caso Carlos · a BMW"}, {"t": "raw", "title": "Caso Carlos · a BMW", "lines": ["Cadência da BMW. Cadência que prende.", "Stories 1 · Gancho: foto do carro · \"Será?\" — galera para", "Stories 2 · Desenvolvimento: \"Falta pouco\" + foto na rotina (já tá conectando consórcio sem dizer)", "Stories 3 · Enquete: \"Qual o valor dessa parcela? R$ 800 ou R$ 2.000?\" — galera engaja", "Stories 4 · Prova: resultado da enquete + parcela real após contemplação (R$ 697)", "Stories 5 · Autoridade: \"Carro não é investimento. A forma inteligente é fugir de juros — consórcio resolve\"", "Stories 6 · Chamada: \"Comenta CARRO que eu te explico\"", "Resultado · Caso Real", "\"Ela leu até o final.\"", "\"Uma cliente entrou no meu perfil, foi descendo, leu carrossel que eu tinha postado oito semanas atrás. Última palavra era 'comenta MÁQUINA'. Ela comentou. Robô entrou em ação. Tô conversando com ela. Sem chamada, ela passa.\""]}, {"t": "h2", "x": "09 · O robô · 8 tipos de cadência"}, {"t": "raw", "title": "O robô · 8 tipos de cadência", "lines": ["Você não precisa pensar. Escolhe o tipo. O robô entrega.", "01Cliente acabou de ser contemplado", "02Negócio que você acabou de fechar", "03Cliente cheio de dúvidas", "04Algo que você aprendeu", "05Sua rotina com um insight", "06Oportunidade forte pra vender", "07Conteúdo educativo ou notícia", "08Reunião com cliente", "Abrir Robô · Stories que Vendem Consórcio →", "Entra no robô, pergunta \"como você pode me ajudar?\". Ele lista os 8 tipos. Você escolhe um, conta tua história em 2 linhas, ele entrega a cadência pronta. Você lê e ajusta com tuas palavras — não copia e cola direto."]}, {"t": "h2", "x": "10 · Cadência boa vira destaque"}, {"t": "raw", "title": "Cadência boa vira destaque", "lines": ["Funil permanente. Trabalha 24h depois das 24h.", "Cada Stories da cadência: três pontinhos → Destacar → nome do destaque", "Adiciona um por um na mesma capa — vira sequência salva", "Capa: editar destaque → editar capa → escolhe da galeria (pode subir uma feita no Canva)", "Categorias estratégicas: Depoimentos, Contemplados, Treinamentos, Família, Sobre o produto, Caixinha de dúvidas", "Destaque é funil que trabalha enquanto você faz outra coisa. Cliente entra no perfil, bate o olho na sequência, cai na chamada lá no fim. Você nem precisa estar online."]}, {"t": "h2", "x": "11 · Quem engajou, você aborda"}, {"t": "raw", "title": "Quem engajou, você aborda", "lines": ["Cliente curtiu = ele tá pedindo pra ser abordado.", "Vai no Stories antigo → vê quem visualizou, quem curtiu, quem comentou", "Quem reagiu mais de uma vez = quente. Aborda primeiro", "Não é invasão. É educação. Ele tá esperando você"]}, {"t": "msg", "title": "Abordagem · cliente que engajou", "when": "", "x": "Oi [nome], tudo bem?\nVi você passando pelos meus Stories esses dias\ne eu sempre fico curioso com quem me acompanha.\nO que você achou do conteúdo?\n3 perguntas e sai da rede social. Quebra-gelo → entrega valor → leva pra ligação ou WhatsApp. Não fica preso no Direct."}, {"t": "h2", "x": "12 · O desafio dos próximos 30 dias"}, {"t": "raw", "title": "O desafio dos próximos 30 dias", "lines": ["Toda semana. 1 cadência intencional por dia. 30 dias.", "1 cadência completa por dia — gancho, desenvolvimento, prova, autoridade, chamada", "2 posts no feed por semana — escala a mesma mensagem em formatos diferentes", "3 depoimentos por semana — cliente real, em cidades diferentes", "1 cadência boa virada em destaque por semana — funil permanente", "Abordar todo cliente que engajou nas últimas 24h", "Em 30 dias o cliente entra no teu perfil, desce, bate o olho em 3 destaques de prova, lê uma cadência ativa, vê tua autoridade. Aí ele comenta a palavra. Aí o robô entra. Aí você vende.", "Stories é a maior arma do vendedor.", "Só funciona pra quem é intencional."]}]}, {"id": "m08", "title": "Aula 08 · Reels, Reacts e Próximos Passos", "stage": [], "lead": "\"Antes de investir em tráfego pago, seu perfil precisa estar pronto. Tráfego traz gente nova — e se o perfil não converte, você queima dinheiro.\"", "blocks": [{"t": "raw", "title": "Abertura", "lines": ["Reels, Reacts e Próximos Passos", "130 min", "Conteúdo avançado e perfil pronto pra tráfego.", "\"Antes de investir em tráfego pago, seu perfil precisa estar pronto. Tráfego traz gente nova — e se o perfil não converte, você queima dinheiro.\""]}, {"t": "h2", "x": "01 · Caixinha de pergunta · máquina de pauta"}, {"t": "raw", "title": "Caixinha de pergunta · máquina de pauta", "lines": ["As dúvidas do cliente viram conteúdo.", "Abre a caixinha nos Stories — pergunta direta sobre consórcio, financiamento, investimento", "Cada resposta vira 1 Reel — você nunca mais fica sem pauta", "O cliente vê a pergunta dele respondida = autoridade imediata", "Vira destaque no perfil — funil que trabalha 24h depois das 24h", "01 · Gancho", "Repete a pergunt  "- Público: [famílias que querem sair do aluguel / autônomos / etc]", "- Resultado principal: [ajudo a conquistar imóvel sem juros]", "- Anos de experiência: [X anos]", "- Clientes atendidos: [+200 clientes]", "- Cartas contempladas / resultados concretos: [80 cartas / +R$30M em vendas]", "- Administradoras / empresa: [Porto Seguro / Embracon / etc]", "- Cidade / região: [sua cidade]", "- Instagram: [@seuinstagram]", "- WhatsApp: [seu número]", "Estrutura obrigatória (nessa ordem):", "1. TRANSFORMAÇÃO · comece com o que o cliente conquista comigo", "2. COMO FAÇO · explique brevemente a consultoria", "3. AUTORIDADE · experiência, clientes, resultados", "4. REDES · direcione pro Instagram com frase de valor", "5. CONTATO · chamada pra LinkedIn ou WhatsApp", "Regras:", "- Tom profissional e humano", "- Máximo 2.600 caracteres (ideal: 1.500)", "- Sem \"apaixonado\", \"dedicado\", \"comprometido\", \"soluções\", \"excelência\"", "- Em parágrafos com espaçamento. Sem bullet points", "- Primeira frase já prende a atenção"]}, {"t": "h2", "x": "07 · Funil 4 · URL e Site"}, {"t": "raw", "title": "Funil 4 · URL e Site", "lines": ["Cliente nunca digita ponto ou underline na busca.", "Erra", "/in/joao-silva-9374832hf", "/in/marconi.consorcio", "/in/thiago_schneider_", "Acerta", "/in/joaosilvaconsorcio", "/in/marconiconsorcio", "/in/thiagoschneider", "URL do perfil: mesmo posicionamento do Instagram. Sem números, sem underline antes do nome", "Botão Site (Informações de contato): cola seu Linktree · WhatsApp em primeiro lugar dentro do Linktree", "Centraliza tudo num único link · o cliente clica e acessa todas suas redes", "Editar texto do botão (\"Fale comigo\") pode ser bloqueado no plano gratuito. Cola o link igual — funciona"]}, {"t": "h2", "x": "08 · Funil 5 · Experiência"}, {"t": "raw", "title": "Funil 5 · Experiência", "lines": ["Cabeleireiro vira consultor. A IA conecta tua história.", "Coloca toda tua experiência · não só consórcio", "Trabalhou em salão, banco, escola, s", "Certo · passa", "Davi Hebert Consultor de Consórcio", "Ana Clara Consultora de Consórcio", "Eduardo Borba Consultor de Consórcio", "Mesmo nome do Instagram e do LinkedIn. Os três falam a mesma língua", "Tipo do negócio: serviços locais (95% dos casos)", "Quem tem loja física própria — e só esse caso — pode marcar loja física"]}, {"t": "h2", "x": "05 · Categoria"}, {"t": "raw", "title": "Categoria", "lines": ["Consultoria. Só consultoria.", "Palavras de bloqueio", "Consultoria financeira", "Consultor financeiro", "Investimentos", "Passa direto", "Consultoria", "Se você coloca \"consultoria financeira\", a régua de aprovação sobe e o Google pede o triplo de coisa pra liberar. Vai direto em consultoria."]}, {"t": "h2", "x": "06 · Onde você atende"}, {"t": "raw", "title": "Onde você atende", "lines": ["2 horas de carro da sua cidade. Não mais que isso.", "Cidade onde você mora + cidades a até 2h de distância", "\"Brasil inteiro\" = você não rankeia em lugar nenhum. Já testei. Não funciona", "Endereço fica privado. Só o Google sabe. Cliente fala com você pelo link", "Quem é consultor não coloca o endereço da administradora. Você é consultor, não loja"]}, {"t": "h2", "x": "07 · Lista de serviços"}, {"t": "raw", "title": "Lista de serviços", "lines": ["Lista o que o cliente busca. Não o que você vende.", "Pelo menos 5 serviços. Depois cada um pede descrição (300 caracteres) + foto.", "Consórcio de carro", "Consórcio de imóvel", "Consórcio de moto", "Consórcio de caminhão", "Consórcio rural", "Consórcio de viagem", "Consórcio de reforma", "Simulação de consórcio", "Análise de carta", "Contemplação", "Transferência de cota", "Lance"]}, {"t": "h2", "x": "08 · Horário de funcionamento"}, {"t": "raw", "title": "Horário de funcionamento", "lines": ["8h às 18h. Nunca 24 horas.", "Segunda a sexta: 8h às 18h · Sábado: até meio dia · Domingo: fechado", "\"24 horas\" faz a régua de aprovação subir — não tem consultoria 24h", "Depois que o perfil estiver maduro você muda. Agora, foco em passar na verificação"]}, {"t": "h2", "x": "09 · Descrição com IA"}, {"t": "raw", "title": "Descrição com IA", "lines": ["750 caracteres. Palavra-chave 3 vezes. SEO local.", "\"Consórcio em [tua cidade]\" aparece nos primeiros 100 caracteres", "Mesma palavra-chave repetida 3 vezes de forma natural — assim o Google ranqueia", "Estrutura: posicionamento → quem atendo → administradoras → diferencial → CTA WhatsApp", "Sem \"melhor\", sem \"top\", sem \"realize sonhos\". Direto"]}, {"t": "msg", "title": "Prompt · Descrição do GMN", "when": "", "x": "Você é um especialista em SEO local e copywriting pra Google Meu Negócio.\nCrie a descrição do meu perfil seguindo essas regras:"}, {"t": "raw", "title": "Descrição com IA", "lines": ["• Máximo 750 caracteres", "• Palavra-chave \"Consórcio em [MINHA CIDADE]\" repetida 3 vezes de forma natural,", "sendo 1 nas primeiras 100 caracteres", "• Estrutura: posicionamento → quem atendo → administradoras → diferencial → CTA WhatsApp", "• Tom: direto, sem enrolação, sem palavras genéricas tipo \"melhor\" ou \"top\"", "Antes de escrever, me faça as perguntas necessárias sobre meu negócio", "(cidade, anos de experiência, prova social, administradoras que trabalho,", "diferencial real, tipos de consórcio que mais vendo).", "Quando eu responder, entregue 2 versões: uma equilibrada e uma mais agressiva", "em prova social.", "No mesmo chat, pede também as 12 descrições curtas (300 caracteres) pra cada serviço da lista. Ele já tem o contexto, sai em sequência."]}, {"t": "h2", "x": "10 · Fotos reais"}, {"t": "raw", "title": "Fotos reais", "lines": ["Foto real. O Google sabe se você pegou no Google Imagens.", "Foto de vitrine: a mesma profissional do Instagram. Rosto, não logo", "Fotos da empresa: fachada, atendimento, equipe — do local real", "Quem não tem escritório físico: pula. Sem inventar foto", "Logo entra em outro campo. Aqui é gente e ambiente"]}, {"t": "h2", "x": "11 · O que NÃO clicar"}, {"t": "raw", "title": "O que NÃO clicar", "lines": ["Anúncio, teste e e-mail pago. A gente pula tudo.", "Não clica em \"criar anúncio no Google\" — te joga pro Google Ads e bagunça", "Não clica em \"fazer um teste\" — te manda pro Meta Edge, vira outra conta", "Não compra o e-mail personalizado do próprio Google. Não é hora", "Quem clicou errado: volta e pula. Dá pra desfazer"]}, {"t": "h2", "x": "12 · Verificação · espera de até 5 dias"}, {"t": "raw", "title": "Verificação · espera de até 5 dias", "lines": ["Vídeo de 15 a 30 segundos. Mostra que você existe.", "25% aprova na hora · 70% pede vídeo · uma minoria recebe SMS", "Vídeo: câmera frontal, mostra a rua, mostra o escritório, mostra o computador", "Fala: \"Esse aqui é meu escritório. Eu trabalho aqui. Eu sou consultor de consórcio\"", "Sem escritório: faz num cantinho de casa com o computador aparecendo", "Quem não recebeu pedido de vídeo: tenta postar uma postagem. Se deixar postar, aprovou", "Depois do vídeo, o Google fala que vai analisar em até 5 dias. Acompanhe todo dia. Maioria sai na semana. Enquanto não aprovar, não dá pra pedir avaliação."]}, {"t": "h2", "x": "13 · Editar perfil até o talo"}, {"t": "raw", "title": "Editar perfil até o talo", "lines": ["Preenche tudo. Cada campo vazio te tira do ranking.", "Redes sociais: Instagram, LinkedIn, TikTok, YouTube — tudo conectado", "Site: usa o Linktree. Nunca o link direto do Instagram", "Pega o link do LinkedIn que você editou na Aula 09 e cola aqui", "Logo, foto, horário, serviços — sem deixar nada em branco", "E-mail corporativo (não @gmail, não @hotmail) destrava a barra de força até 100%"]}, {"t": "h2", "x": "14 · As 3 primeiras avaliações"}, {"t": "raw", "title": "As 3 primeiras avaliações", "lines": ["3 clientes que você confia. Nunca colega de turma.", "Depois que aprovar, aparece \"Solicitar avaliação\" · copia o link", "Manda em 3 clientes reais: \"acabei de criar o Google Meu Negócio, faz uma avaliação pra mim\"", "Nunca trocar avaliação entre alunos. O Google derruba os dois", "Mesm dia nas janelas certas: 9h · 11h · 17h. Um follow-up por janela. O lead respondeu em qualquer ponto? Sai da cadência e vira atendimento.", "Check-in 1", "Dia 1", "9h", "📞", "Ligação + \"tentei te ligar\"", "11h", "💬", "Mensagem leve", "17h", "🎥", "Vídeo da loja", "Check 2", "Dia 2", "9h", "🎤", "Áudio mudo · apaga · Pix", "11h", "🏆", "Prova social", "17h", "📞", "Ligação + simulação", "Check 3", "Dia 3", "9h", "📞", "Ligação sincera", "11h", "😂", "Meme", "17h", "💳", "Carta disponível", "Check 4", "Dia 4", "9h", "🚪", "Encerramento", "❄️", "Geladeira", "Os 16 gatilhos que essa cadência usa", "Nenhuma mensagem aqui é aleatória. Cada uma carrega um gatilho de persuasão — e embaixo de cada mensagem você vê quais foram usados nela. É por isso que essa cadência não é uma lista de textos: é um mapa de persuasão aplicado ao consórcio.", "Reciprocidade", "Quem recebe primeiro sente que deve retribuir. Você liga, grava vídeo e monta simulação antes de pedir qualquer coisa.", "FU 1 · 3 · 6", "Compromisso e coerência", "Quem preencheu o formulário já se comprometeu. Lembrar do próprio ato dele puxa a coerência.", "FU 1 · 2 · 6 · 7", "Prova social", "Gente acredita em gente. O print do resultado de outro cliente vale mais que qualquer argumento seu.", "FU 1 · 5", "Afinidade", "A gente compra de quem parece com a gente e de quem trata a gente bem. \"Sei que é corrido\" é afinidade.", "FU 2 · 3 · 4 · 7 · 8", "Autoridade", "Quem se apresenta como consultor da empresa e diz o que faz o dia inteiro ocupa o lugar de quem entende.", "FU 1 · 3 · 7", "Escassez", "O que é limitado vale mais. A carta que existe de verdade e pode ir pra outro cliente.", "FU 2 · 9 · 10", "Aversão à perda", "Perder pesa mais do que ganhar o mesmo tanto. Por isso \"vou liberar pra outro\" move mais que \"aproveite\".", "FU 2 · 9 · 10", "Ancoragem", "O primeiro número dito vira a régua de tudo que vem depois. Por isso a carta entra com valor e parcela.", "FU 9", "Exclusividade", "Separado pra ele, não pra todo mundo. \"Lembrei de você na hora\" faz a oportunidade ter nome.", "FU 9 · 10", "Curiosidade", "A lacuna entre o que ele sabe e o que ele quer saber incomoda até ser fechada. É o motor do áudio mudo.", "FU 4 · 5", "Assunto em aberto", "O cérebro não solta o que ficou pela metade. Áudio que não tocou e mensagem apagada ficam abertos na cabeça dele.", "FU 4", "Quebra de padrão", "O cérebro dá atenção ao inesperado e ignora o repetido. Décimo \"oi, tudo bem?\" é ruído; pedir chave Pix não é.", "FU 4 · 8", "Quebra-gelo", "Humor desarma. Meme e brincadeira tiram o peso da cobrança e devolvem a conversa pro lugar leve.", "FU 4 · 8", "Transparência", "Falar na cara que não quer ser chato desmonta a defesa. Sinceridade compra resposta.", "FU 7", "Redução de risco", "Lead de anúncio tem medo de golpe. Loja de verdade, porta aberta, rosto na tela mata o medo no dia 1.", "FU 3", "Não-venda", "Pressão gera resistência. Tirar a pressão devolve a liberdade e é justamente aí que ele responde.", "FU 10", "A \"força\" que aparece embaixo de cada mensagem é a leitura do método sobre o poder de resposta daquela mensagem na prática.", "As janelas não são chute: os dados mostram que 8h às 11h e 16h às 18h são os horários que mais conectam. Meio-dia é a pior janela. Ver o estudo dos horários ↗"]}, {"t": "h2", "x": "04 · Check-in 1 · Dia 1"}, {"t": "raw", "title": "Check-in 1 · Dia 1", "lines": ["O lead acabou de te pedir contato. Age como quem recebeu o pedido.", "📞", "Liga primeiro. Lead caiu em horário comercial? Liga em até 5 minutos. Não atendeu? Aí manda a mensagem:"]}, {"t": "msg", "title": "Follow-up 1 · 9h · Ligou e não atendeu", "when": "", "x": "{nome}, tudo bem? Aqui é o [SEU NOME], consultor da [SUA EMPRESA]."}, {"t": "raw", "title": "Check-in 1 · Dia 1", "lines": ["Você preencheu o formulário sobre [TEMA DO ANÚNCIO], com o objetivo de [OBJETIVO DO FORMULÁRIO].", "Tenho ajudado diversas pessoas a chegarem nesse mesmo objetivo, e acabei de te ligar pra te atender.", "Não consegui f
